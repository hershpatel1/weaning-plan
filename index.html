<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riyaan's Weaning Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#4C5FD5;--teal-dark:#3B4BB0;--teal-deep:#262F7A;--teal-light:#C7CDF5;--teal-surface:#EAEBFB;
  --burgundy:#D6365B;--burgundy-light:#FBE1E7;--pink:#2FB8C4;
  --amber-light:#FCEACB;--amber-deep:#8A5A00;
  --bg-1:#F4F6FA;--bg-2:#EAEDF5;--card:#FFFFFF;--border:#E1E5EE;
  --text:#151A23;--text-muted:#6B7280;
  --shadow-sm:0 1px 2px rgba(21,26,35,0.05);--shadow-md:0 2px 6px rgba(21,26,35,0.07);
}

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg-1);color:var(--text);line-height:1.5;font-size:14px;}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 60px;}
.header-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;padding-bottom:14px;border-bottom:2px solid var(--teal-dark);}
h1{font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:700;letter-spacing:-0.01em;}
.sync-status{font-size:9px;font-weight:700;padding:2px 8px;border-radius:3px;background:var(--bg-2);color:var(--text-muted);}
.sync-status.live{background:var(--teal-surface);color:var(--teal-dark);}
.sync-status.err{background:var(--burgundy-light);color:var(--burgundy);}

section{margin-bottom:24px;}
h2{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;color:var(--teal-dark);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.card{background:var(--card);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow-sm);border:1px solid var(--border);}

/* Next meal */
.next-meal{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:12px;padding:20px;}
.next-meal .stage-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--teal-dark);background:var(--teal-surface);padding:3px 10px;border-radius:20px;margin-bottom:10px;}
.next-meal .items{font-family:'Space Grotesk',sans-serif;font-size:clamp(18px,4.5vw,22px);font-weight:600;margin-bottom:4px;line-height:1.3;}
.next-meal .meta{font-size:12.5px;color:var(--text-muted);margin-bottom:10px;}
.next-meal .allergen-note{font-size:12.5px;color:var(--burgundy);font-weight:600;margin-bottom:10px;}
.food-link{color:var(--teal-dark);cursor:pointer;background:var(--teal-surface);border:1px solid var(--teal-light);border-radius:6px;font:inherit;font-weight:600;padding:2px 8px;}
.food-link:hover{background:var(--teal-light);}
.hist-food-link{color:var(--teal-dark);cursor:pointer;background:none;border:none;font:inherit;font-weight:600;padding:0;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;}
.btn{display:inline-block;background:var(--teal);color:#fff;border:none;border-radius:9px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px;}
.btn:hover{background:var(--teal-deep);}
.btn.secondary{background:var(--card);color:var(--teal-dark);border:1px solid var(--teal-dark);}
.btn.danger{background:var(--burgundy-light);color:var(--burgundy);}

/* Recipe panel */
.recipe-panel{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--teal-dark);padding:18px;max-height:60vh;overflow-y:auto;z-index:400;display:none;}
.recipe-panel.open{display:block;}
.recipe-panel h3{font-family:'Space Grotesk',sans-serif;font-size:17px;color:var(--teal-dark);margin-bottom:8px;}
.recipe-panel .close-btn{float:right;background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-muted);}
.recipe-panel p{font-size:13px;margin-bottom:6px;}

/* Shared field styles used inside the sheet */
label{font-size:11.5px;font-weight:600;color:var(--teal-dark);display:block;margin-bottom:5px;}
input,select,textarea{width:100%;font-size:16px;font-family:inherit;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-1);color:var(--text);}
textarea{resize:vertical;min-height:50px;}
.chip-group{display:flex;flex-wrap:wrap;gap:8px;}
.chip{border:1px solid var(--border);background:var(--bg-1);border-radius:20px;padding:10px 16px;font-size:13.5px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;}
.chip.selected{background:var(--teal-dark);color:#fff;border-color:var(--teal-dark);}
.chip.reaction-liked.selected{background:var(--teal-dark);}
.chip.reaction-refused.selected{background:var(--burgundy);border-color:var(--burgundy);}
.chip.reaction-neutral.selected{background:var(--text-muted);border-color:var(--text-muted);}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13.5px;}
.checkbox-row input{width:auto;min-height:20px;}
.sub-fields{padding:10px;background:var(--bg-1);border-radius:8px;margin-top:6px;display:none;}
.sub-fields.open{display:block;}

/* FAB */
.fab{position:fixed;right:20px;bottom:24px;width:58px;height:58px;border-radius:50%;background:var(--teal);color:#fff;border:none;font-size:28px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(76,95,213,0.4);z-index:250;}
.fab:active{transform:scale(0.94);}

/* Bottom sheet */
.sheet-backdrop{position:fixed;inset:0;background:rgba(21,26,35,0.4);z-index:390;display:none;}
.sheet-backdrop.open{display:block;}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;background:var(--card);border-radius:20px 20px 0 0;z-index:395;transform:translateY(110%);transition:transform 0.32s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(21,26,35,0.18);}
.sheet.open{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 4px;}
.sheet-header{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 10px;}
.sheet-dots{display:flex;gap:6px;}
.sheet-dots span{width:7px;height:7px;border-radius:50%;background:var(--border);}
.sheet-dots span.active{background:var(--teal);width:18px;border-radius:4px;}
.sheet-close{background:none;border:none;font-size:22px;color:var(--text-muted);cursor:pointer;line-height:1;padding:4px 6px;}
.sheet-body{padding:4px 20px 18px;overflow-y:auto;flex:1;}
.sheet-step-title{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;margin-bottom:14px;}
.sheet-footer{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--border);}
.sheet-footer .btn{flex:1;}

/* Format cards */
.format-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.format-card{border:2px solid var(--border);background:var(--bg-1);border-radius:12px;padding:14px;cursor:pointer;text-align:left;}
.format-card.selected{border-color:var(--teal);background:var(--teal-surface);}
.format-card .fc-icon{color:var(--teal-dark);margin-bottom:8px;}
.format-card .fc-title{font-weight:700;font-size:13.5px;margin-bottom:2px;}
.format-card .fc-desc{font-size:11.5px;color:var(--text-muted);line-height:1.35;}

/* Reaction cards */
.reaction-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.reaction-card{border:2px solid var(--border);background:var(--bg-1);border-radius:12px;padding:16px 8px;cursor:pointer;text-align:center;}
.reaction-card .rc-icon{font-size:26px;margin-bottom:4px;}
.reaction-card .rc-label{font-size:12.5px;font-weight:700;}
.reaction-card.selected.r-liked{border-color:var(--teal);background:var(--teal-surface);}
.reaction-card.selected.r-neutral{border-color:var(--text-muted);background:var(--bg-2);}
.reaction-card.selected.r-refused{border-color:var(--burgundy);background:var(--burgundy-light);}

/* Progress */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.stat-card{background:var(--card);border-radius:10px;padding:12px 14px;border:1px solid var(--border);box-shadow:var(--shadow-sm);}
.stat-card .num{font-family:'Space Grotesk',sans-serif;font-size:clamp(18px,5vw,24px);font-weight:600;color:var(--teal-dark);white-space:nowrap;}
.stat-card .lbl{font-size:11px;color:var(--text-muted);}
.allergen-list{margin-top:10px;font-size:12.5px;}
.allergen-list .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);}
.allergen-list .row:last-child{border-bottom:none;}
.status-pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;}
.status-done{background:var(--teal-surface);color:var(--teal-dark);}
.status-due{background:var(--amber-light);color:var(--amber-deep);}
.status-wait{background:var(--bg-2);color:var(--text-muted);}
.status-alert{background:var(--burgundy-light);color:var(--burgundy);}

/* Shopping */
.shop-list{columns:2;font-size:13px;}
.shop-list div{padding:2px 0;}

/* History */
.hist-entry{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:8px;font-size:13px;}
.hist-entry .top{display:flex;justify-content:space-between;align-items:center;}
.hist-entry .items{font-weight:600;}
.hist-entry .date{color:var(--text-muted);font-size:11.5px;}
.hist-entry .tags{margin-top:4px;font-size:11.5px;color:var(--text-muted);}
.hist-entry .actions{margin-top:6px;display:flex;gap:6px;}
.hist-entry .actions button{font-size:12.5px;padding:9px 14px;min-height:40px;}
.empty{color:var(--text-muted);font-size:13px;font-style:italic;}
.nav-link{font-size:12.5px;color:var(--teal-dark);text-decoration:none;border-bottom:1px dotted var(--teal-dark);}

@media(max-width:600px){.stat-grid{grid-template-columns:1fr 1fr;}.shop-list{columns:1;}}
</style>
</head>
<body>
<div class="wrap">

<div class="header-bar">
  <h1>Riyaan's Weaning Log</h1>
  <div style="display:flex;align-items:center;gap:12px;">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB7jLl4DbwmNVJ_lCDMk6pQCO1ROdpXJZw",
  authDomain: "weaning-plan.firebaseapp.com",
  projectId: "weaning-plan",
  storageBucket: "weaning-plan.firebasestorage.app",
  messagingSenderId: "982823182771",
  appId: "1:982823182771:web:da8686f4e95426a9452bc6"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const mealsCol = collection(db, "mealLog");
const statusEl = document.getElementById('syncStatus');

// ---------------- Reference data ----------------
const FOODS = [
  {name:"Sweet potato", cat:"veg", formats:["soft","finger"], unlockWeek:1, soft:"Steamed and mashed or puréed", finger:"Steamed spear, adult-finger sized"},
  {name:"Potato", cat:"veg", formats:["soft","finger"], unlockWeek:1, soft:"Boiled and mashed", finger:"Boiled wedge"},
  {name:"Carrot", cat:"veg", formats:["soft","finger"], unlockWeek:1, soft:"Steamed and puréed", finger:"Steamed stick, well softened"},
  {name:"Butternut squash", cat:"veg", formats:["soft","finger"], unlockWeek:1, soft:"Roasted and mashed", finger:"Roasted spear"},
  {name:"Parsnip", cat:"veg", formats:["soft","finger"], unlockWeek:1, soft:"Steamed and puréed", finger:"Steamed spear"},
  {name:"Courgette", cat:"veg", formats:["soft","finger"], unlockWeek:1, soft:"Steamed and mashed", finger:"Steamed spear, skin on"},
  {name:"Spinach", cat:"veg", formats:["soft"], unlockWeek:1, soft:"Wilted/steamed, finely puréed or mashed", finger:"Not yet — offer soft wilted strands once pincer grasp is established"},
  {name:"Peas", cat:"veg", formats:["soft","finger"], unlockWeek:2, soft:"Steamed and mashed — squash each pea before serving whole", finger:"Soft-cooked whole peas, squashed, once pincer grip is there"},
  {name:"Green beans", cat:"veg", formats:["soft","finger"], unlockWeek:2, soft:"Steamed and puréed", finger:"Steamed bean, halved lengthways"},
  {name:"Broccoli", cat:"veg", formats:["soft","finger"], unlockWeek:2, soft:"Steamed and mashed", finger:"Steamed floret, stem trimmed"},
  {name:"Cauliflower", cat:"veg", formats:["soft","finger"], unlockWeek:2, soft:"Steamed and puréed", finger:"Steamed floret"},
  {name:"Avocado", cat:"veg", formats:["soft","finger"], unlockWeek:2, soft:"Mashed, no cooking needed", finger:"Ripe spear, skin on as a handle"},
  {name:"Sweetcorn", cat:"veg", formats:["soft","finger"], unlockWeek:2, soft:"Cooked kernels, blended and sieved", finger:"Corn on the cob to gnaw, supervised — not loose kernels"},
  {name:"Red lentil", cat:"legume", formats:["soft"], unlockWeek:2, soft:"Cooked soft and mashed or blended, dal-style", finger:"Not applicable — too small, choking risk whole"},
  {name:"Cabbage", cat:"veg", formats:["soft","finger"], unlockWeek:3, soft:"Steamed until very soft, finely puréed", finger:"Steamed strip, well softened"},
  {name:"Red peppers", cat:"veg", formats:["soft","finger"], unlockWeek:3, soft:"Roasted, skin removed, puréed", finger:"Roasted strip, skin removed"},
  {name:"Beetroot", cat:"veg", formats:["soft","finger"], unlockWeek:3, soft:"Roasted or boiled, puréed", finger:"Roasted spear, cooled and softened"},
  {name:"Aubergine", cat:"veg", formats:["soft","finger"], unlockWeek:3, soft:"Roasted and mashed", finger:"Roasted strip, skin removed"},
  {name:"Chickpea", cat:"legume", formats:["soft"], unlockWeek:3, soft:"Well cooked and mashed", finger:"Not applicable yet — whole chickpeas are a choking hazard"},
  {name:"Butter bean", cat:"legume", formats:["soft"], unlockWeek:3, soft:"Well cooked and mashed", finger:"Not applicable yet"},
  {name:"Rice", cat:"grain", formats:["soft"], unlockWeek:3, soft:"Cooked very soft and slightly sticky, mashed", finger:"Not applicable at this stage"}
];
const ALLERGENS = [
  {name:"Dairy", ingredient:"Plain yoghurt"},
  {name:"Peanut", ingredient:"Peanut butter, smooth"},
  {name:"Wheat", ingredient:"Wheat bread or pasta"},
  {name:"Sesame", ingredient:"Sesame seeds, ground at home"},
  {name:"Soya", ingredient:"Firm tofu"},
  {name:"Tree nut", ingredient:"Cashews, ground at home"}
];
// Ground/powdered, no salt, no heat — safe from 6 months in small (pinch) amounts per BSACI-aligned weaning guidance.
// Deliberately excludes chilli/pepper (heat) and anything only recommended from 8mo+ (clove, mustard) to keep this list safe by default.
const SPICES = ["Turmeric","Cumin","Coriander","Fennel","Asafoetida (hing)","Ginger","Cardamom","Cinnamon"];
const foodByName = {}; FOODS.forEach(f=>foodByName[f.name]=f);

// ---------------- State ----------------
let entries = [];
let editingId = null;
let selectedItems = [];
let selectedReaction = null;
let selectedAllergens = [];
let selectedAllergenReaction = null;
let selectedSpices = [];

// ---------------- Derived stats ----------------
function computeStats(){
  const foodExposures = {}; // name -> [{ts, reaction}]
  FOODS.forEach(f=>foodExposures[f.name]=[]);
  const pairs = {}; // "A+B" -> {count, spicedCount, combinedCount, lastPlainReaction, lastSpicedReaction, lastCombinedReaction}
  const allergenLog = {}; // name -> [{ts, reaction}]
  ALLERGENS.forEach(a=>allergenLog[a.name]=[]);

  const sorted = [...entries].sort((a,b)=> new Date(a.ts) - new Date(b.ts));
  sorted.forEach(e=>{
    (e.items||[]).forEach(it=>{ if(foodExposures[it]) foodExposures[it].push({ts:e.ts, reaction:e.reaction}); });
    if(e.items && e.items.length===2){
      const key = [...e.items].sort().join(' + ');
      if(!pairs[key]) pairs[key] = {count:0, spicedCount:0, combinedCount:0, lastPlain:null, lastSpiced:null, lastCombined:null};
      const p = pairs[key];
      if(e.format==='combined'){ p.combinedCount++; p.lastCombined=e.reaction; }
      else if(e.spices && e.spices.length){ p.spicedCount++; p.lastSpiced=e.reaction; }
      else { p.count++; p.lastPlain=e.reaction; }
    }
    if(e.allergenUsed && e.allergens){
      e.allergens.forEach(a=>{ if(allergenLog[a]) allergenLog[a].push({ts:e.ts, reaction:e.allergenReaction}); });
    }
  });

  const dayMs = 86400000;
  const now = new Date();
  const acceptance = {};
  FOODS.forEach(f=>{
    const exp = foodExposures[f.name];
    const last2 = exp.slice(-2).map(x=>x.reaction);
    acceptance[f.name] = exp.length>=3 && !last2.includes('Refused');
  });

  const allergenStatus = {};
  ALLERGENS.forEach(a=>{
    const log = allergenLog[a.name];
    const hadReaction = log.some(x=>x.reaction==='reaction');
    let state = 'not-started';
    if(hadReaction) state = 'reaction';
    else if(log.length>=2) state = 'introduced';
    else if(log.length===1) state = 'awaiting-repeat';
    const lastGiven = log.length ? new Date(log[log.length-1].ts) : null;
    const daysSince = lastGiven ? Math.floor((now-lastGiven)/dayMs) : null;
    allergenStatus[a.name] = {state, lastGiven, daysSince, count:log.length};
  });

  // unlock week: based on days since first entry (or today if none)
  const firstTs = sorted.length ? new Date(sorted[0].ts) : now;
  const weeksSinceStart = Math.max(1, Math.floor((now-firstTs)/(7*dayMs))+1);
  const unlockedFoods = FOODS.map(f=>f.name); // all foods available from day one — pacing is driven by logged data, not the calendar

  return {foodExposures, pairs, allergenStatus, acceptance, unlockedFoods, weeksSinceStart};
}

// ---------------- Suggestion engine ----------------
function suggestAllergenAction(stats){
  const order = ALLERGENS.map(a=>a.name);
  // priority 1: any allergen awaiting its day-2 repeat
  for(const name of order){
    if(stats.allergenStatus[name].state==='awaiting-repeat') return {type:'repeat', name};
  }
  // priority 2: maintenance due (introduced, >=3 days since last given)
  const due = order.find(name=>{
    const s = stats.allergenStatus[name];
    return s.state==='introduced' && s.daysSince!==null && s.daysSince>=3;
  });
  if(due) return {type:'maintenance', name:due};
  // priority 3: next new allergen, if last new intro was >=2 days ago (or none started yet)
  const lastIntroDate = order.map(n=>stats.allergenStatus[n]).filter(s=>s.count>0).map(s=>s.lastGiven).sort((a,b)=>b-a)[0];
  const daysSinceLastIntro = lastIntroDate ? Math.floor((new Date()-lastIntroDate)/86400000) : 99;
  if(daysSinceLastIntro>=2){
    const next = order.find(name=>stats.allergenStatus[name].state==='not-started');
    if(next) return {type:'new', name:next};
  }
  return null;
}

function suggestNextMeal(stats){
  const allergenAction = suggestAllergenAction(stats);
  const allergenTag = allergenAction ? (
    allergenAction.type==='repeat' ? 'Repeat allergen (day 2): '+allergenAction.name :
    allergenAction.type==='new' ? 'New allergen to introduce: '+allergenAction.name :
    'Allergen maintenance due: '+allergenAction.name
  ) : null;
  const allergenIngredient = allergenAction ? ALLERGENS.find(a=>a.name===allergenAction.name).ingredient : null;
  const withAllergen = obj => ({...obj, allergenTag, allergenIngredient});

  // Discrete graduation events — always take these immediately, they don't wait their turn
  for(const key in stats.pairs){
    const p = stats.pairs[key];
    const items = key.split(' + ');
    if(p.spicedCount>=3 && p.lastSpiced!=='Refused' && p.combinedCount===0){
      return withAllergen({stage:'Combined dish', items, format:'combined', spiceSuggested:true});
    }
    if(p.count>=3 && p.lastPlain!=='Refused' && p.spicedCount===0){
      return withAllergen({stage:'Spiced pair', items, format:'both', spiceSuggested:true});
    }
  }

  // A pair "in progress" (started but not yet ready to graduate) — at most one should be live at a time
  function findInProgress(){
    for(const key in stats.pairs){
      const p = stats.pairs[key];
      const items = key.split(' + ');
      if(p.spicedCount>=1 && p.combinedCount===0 && !(p.spicedCount>=3 && p.lastSpiced!=='Refused')){
        return {stage:'Spiced pair', items, format:'both', spiceSuggested:true};
      }
    }
    for(const key in stats.pairs){
      const p = stats.pairs[key];
      const items = key.split(' + ');
      if(p.count>=1 && p.spicedCount===0 && !(p.count>=3 && p.lastPlain!=='Refused')){
        return {stage:'Paired', items, format:'both', spiceSuggested:false};
      }
    }
    return null;
  }

  const candidates = stats.unlockedFoods.filter(f=>!stats.acceptance[f]);
  const inProgress = findInProgress();

  // Interleave: don't let pairing crowd out foundation reps for foods that still need them
  if(candidates.length>0){
    const alternateToFoundation = (entries.length % 2 === 0) || !inProgress;
    if(alternateToFoundation){
      candidates.sort((a,b)=> stats.foodExposures[a].length - stats.foodExposures[b].length);
      return withAllergen({stage:'Foundation', items:[candidates[0]], format:'both', spiceSuggested:false});
    }
  }
  if(inProgress) return withAllergen(inProgress);

  // No in-progress pair — start exactly one new pair among accepted foods, prioritising foods with the fewest existing pairings for fairness
  const accepted = stats.unlockedFoods.filter(f=>stats.acceptance[f]);
  const pairCountFor = f => Object.keys(stats.pairs).filter(k=>k.split(' + ').includes(f)).length;
  const byFewestPairs = [...accepted].sort((a,b)=> pairCountFor(a)-pairCountFor(b));
  for(let i=0;i<byFewestPairs.length;i++){
    for(let j=i+1;j<byFewestPairs.length;j++){
      const key = [byFewestPairs[i],byFewestPairs[j]].sort().join(' + ');
      if(!stats.pairs[key]){
        return withAllergen({stage:'Paired', items:[byFewestPairs[i],byFewestPairs[j]], format:'both', spiceSuggested:false});
      }
    }
  }
  if(candidates.length){
    candidates.sort((a,b)=> stats.foodExposures[a].length - stats.foodExposures[b].length);
    return withAllergen({stage:'Foundation', items:[candidates[0]], format:'both', spiceSuggested:false});
  }
  return withAllergen({stage:'All caught up', items:[], format:null, spiceSuggested:false});
}

function projectShoppingList(stats){
  // simulate 7 suggested meals forward using a cloned, mutated copy of stats
  const clone = {foodExposures:Object.fromEntries(Object.entries(stats.foodExposures).map(([k,v])=>[k,v.length])), pairs:JSON.parse(JSON.stringify(stats.pairs)), acceptance:{...stats.acceptance}, unlockedFoods:[...stats.unlockedFoods]};
  const needed = new Set();
  for(let i=0;i<7;i++){
    const fakeStats = {
      foodExposures: Object.fromEntries(Object.entries(clone.foodExposures).map(([k,v])=>[k,Array(v)])),
      pairs: clone.pairs, acceptance: clone.acceptance, unlockedFoods: clone.unlockedFoods,
      allergenStatus: stats.allergenStatus // allergen state held constant for this 7-meal projection — good enough for a shopping list, not meant to simulate exact future allergen timing
    };
    const s = suggestNextMeal(fakeStats);
    s.items.forEach(it=>needed.add(it));
    if(s.allergenIngredient) needed.add(s.allergenIngredient);
    // bump exposure count for suggested items so next iteration differs
    s.items.forEach(it=>{ clone.foodExposures[it] = (clone.foodExposures[it]||0)+1; });
    if(s.items.length===0) break;
  }
  return [...needed];
}

// ---------------- Rendering ----------------
const STAGE_ORDER = ['Foundation','Paired','Spiced pair','Combined dish'];
function stageIcon(stage){
  const idx = STAGE_ORDER.indexOf(stage);
  let dots = '';
  for(let i=0;i<4;i++){
    const cx = 4 + i*11;
    dots += i<=idx ? '<circle cx="'+cx+'" cy="6" r="4" fill="currentColor"/>' : '<circle cx="'+cx+'" cy="6" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>';
  }
  return '<svg width="38" height="12" viewBox="0 0 38 12" xmlns="http://www.w3.org/2000/svg">'+dots+'</svg>';
}
function renderNextMeal(stats){
  const s = suggestNextMeal(stats);
  const el = document.getElementById('nextMealCard');
  if(!s.items.length){ el.innerHTML = '<span class="empty">Every unlocked food is accepted and paired — nice work. Check back once more foods unlock.</span>'; return; }
  const itemLinks = s.items.map(it=>'<button class="food-link" data-food="'+escapeHtml(it)+'">'+escapeHtml(it)+'</button>').join(' + ');
  el.innerHTML =
    '<span class="stage-tag">'+stageIcon(s.stage)+s.stage+'</span>'+
    '<div class="items">'+itemLinks+'</div>'+
    '<div class="meta">'+(s.spiceSuggested?'Add a mild spice this time. ':'')+'Format: '+s.format+' · tap a food name for its recipe</div>'+
    (s.allergenTag ? '<div class="allergen-note">'+escapeHtml(s.allergenTag)+'</div>' : '')+
    '<button class="btn" id="prefillBtn">Log this meal</button>';
  document.getElementById('prefillBtn').onclick = ()=>{
    const matchedAllergen = s.allergenTag ? ALLERGENS.find(a=>s.allergenTag.includes(a.name)) : null;
    openSheet({
      items: s.items,
      format: s.format==='combined' ? 'combined' : (s.format==='both'?'both':'soft'),
      allergenUsed: !!matchedAllergen,
      allergens: matchedAllergen ? [matchedAllergen.name] : []
    });
  };
  el.querySelectorAll('.food-link').forEach(b=> b.onclick = ()=>{
    const matchedAllergen = s.allergenTag ? ALLERGENS.find(a=>s.allergenTag.includes(a.name)) : null;
    openRecipe(s.items, {
      format: s.format,
      spiceSuggested: s.spiceSuggested,
      allergens: matchedAllergen ? [matchedAllergen] : []
    });
  });
}

function renderStats(stats){
  const acceptedCount = stats.unlockedFoods.filter(f=>stats.acceptance[f]).length;
  const grid = document.getElementById('statGrid');
  grid.innerHTML =
    '<div class="stat-card"><div class="num">'+acceptedCount+'/'+stats.unlockedFoods.length+'</div><div class="lbl">Foods accepted</div></div>'+
    '<div class="stat-card"><div class="num">'+entries.length+'</div><div class="lbl">Meals logged</div></div>'+
    '<div class="stat-card"><div class="num">'+stats.weeksSinceStart+'</div><div class="lbl">Weeks in</div></div>'+
    '<div class="stat-card"><div class="num">'+Object.keys(stats.pairs).length+'</div><div class="lbl">Pairings started</div></div>';

  const al = document.getElementById('allergenStatus');
  al.innerHTML = ALLERGENS.map(a=>{
    const s = stats.allergenStatus[a.name];
    let pill = '<span class="status-pill status-wait">Not started</span>';
    if(s.state==='awaiting-repeat') pill = '<span class="status-pill status-due">Repeat tomorrow</span>';
    if(s.state==='introduced') pill = '<span class="status-pill status-done">Introduced'+(s.daysSince>=3?' — top-up due':'')+'</span>';
    if(s.state==='reaction') pill = '<span class="status-pill status-alert">Reaction noted — see notes</span>';
    return '<div class="row"><span>'+a.name+'</span>'+pill+'</div>';
  }).join('');
}

function renderShopping(stats){
  const items = projectShoppingList(stats);
  const el = document.getElementById('shopList');
  el.innerHTML = items.length ? items.map(i=>'<div>'+escapeHtml(i)+'</div>').join('') : '<span class="empty">Nothing projected yet — log a meal or two first.</span>';
}

function renderHistory(){
  const el = document.getElementById('historyList');
  if(!entries.length){ el.innerHTML = '<span class="empty">No meals logged yet.</span>'; return; }
  const sorted = [...entries].sort((a,b)=> new Date(b.ts)-new Date(a.ts));
  el.innerHTML = sorted.map(e=>{
    const d = new Date(e.ts);
    const dateStr = d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + ' ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    const tags = [e.format, e.reaction, (e.spices&&e.spices.length)?('spice: '+e.spices.join(', ')):null, e.allergenUsed?('allergen: '+(e.allergens||[]).join(', ')):null].filter(Boolean).join(' · ');
    const itemLinks = (e.items||[]).map(it=>'<button class="hist-food-link" data-food="'+escapeHtml(it)+'">'+escapeHtml(it)+'</button>').join(' + ');
    return '<div class="hist-entry" data-id="'+e.id+'">'+
      '<div class="top"><span class="items">'+itemLinks+'</span><span class="date">'+dateStr+'</span></div>'+
      '<div class="tags">'+escapeHtml(tags)+(e.notes?(' · '+escapeHtml(e.notes)):'')+'</div>'+
      '<div class="actions"><button class="btn secondary" data-edit="'+e.id+'">Edit</button><button class="btn danger" data-del="'+e.id+'">Delete</button></div>'+
    '</div>';
  }).join('');
  el.querySelectorAll('[data-edit]').forEach(b=> b.onclick = ()=>{
    const en = entries.find(x=>x.id===b.dataset.edit);
    if(en) openSheet({...en, editingId: en.id});
  });
  el.querySelectorAll('[data-del]').forEach(b=> b.onclick = ()=>removeEntry(b.dataset.del));
  el.querySelectorAll('.hist-food-link').forEach(b=>{
    b.onclick = ()=>{
      const e = entries.find(x=>x.id===b.closest('.hist-entry').dataset.id);
      if(!e) return;
      const allergenObjs = (e.allergenUsed && e.allergens || []).map(n=>ALLERGENS.find(a=>a.name===n)).filter(Boolean);
      openRecipe(e.items||[], {
        format: e.format,
        spiceNames: e.spices||[],
        allergens: allergenObjs
      });
    };
  });
}

function openRecipe(items, context){
  context = context || {};
  const format = context.format || 'both';
  const foods = items.map(n=>foodByName[n]).filter(Boolean);
  if(!foods.length) return;

  let body = '';
  foods.forEach(f=>{
    body += '<p><b>'+escapeHtml(f.name)+':</b> ';
    if(format==='finger'){ body += escapeHtml(f.finger); }
    else if(format==='soft' || format==='combined'){ body += escapeHtml(f.soft); }
    else { body += 'Soft — '+escapeHtml(f.soft)+'. Finger — '+escapeHtml(f.finger); }
    body += '</p>';
  });
  if(format==='combined' && foods.length>1){
    body += '<p><b>To combine:</b> Prepare each ingredient using its soft method above, then mash or stir together into one dish.</p>';
  }
  if(context.spiceNames && context.spiceNames.length){
    body += '<p><b>Spice:</b> stir in a small pinch of '+escapeHtml(context.spiceNames.join(', '))+', ground, no salt.</p>';
  } else if(context.spiceSuggested){
    body += '<p><b>Spice:</b> a mild spice is suggested this time — pick one from the log form below.</p>';
  }
  (context.allergens||[]).forEach(a=>{
    body += '<p><b>Allergen — '+escapeHtml(a.name)+':</b> stir in '+escapeHtml(a.ingredient)+' to combine.</p>';
  });

  document.getElementById('recipeContent').innerHTML =
    '<h3>'+escapeHtml(items.join(' + '))+'</h3>' + body;
  document.getElementById('recipePanel').classList.add('open');
}
window.closeRecipe = closeRecipe;

function renderAll(){
  const stats = computeStats();
  renderNextMeal(stats);
  renderStats(stats);
  renderShopping(stats);
  renderHistory();
}

// ---------------- Format & reaction option data ----------------
const FORMAT_OPTIONS = [
  {value:'soft', title:'Soft / purée', desc:'Just the smooth version', icon:'<svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="currentColor"/></svg>'},
  {value:'finger', title:'Finger food', desc:'Just self-fed pieces', icon:'<svg width="20" height="20" viewBox="0 0 20 20"><rect x="7" y="2" width="6" height="16" rx="3" fill="currentColor"/></svg>'},
  {value:'both', title:'Both textures', desc:'Same food, offered two ways side by side', icon:'<svg width="20" height="20" viewBox="0 0 20 20"><circle cx="6" cy="10" r="5" fill="currentColor"/><rect x="13" y="3" width="4" height="14" rx="2" fill="currentColor"/></svg>'},
  {value:'combined', title:'Combined dish', desc:'Everything mashed or mixed together as one', icon:'<svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="currentColor" opacity="0.35"/><circle cx="7" cy="8" r="1.6" fill="currentColor"/><circle cx="12" cy="7" r="1.4" fill="currentColor"/><circle cx="11" cy="12" r="1.7" fill="currentColor"/><circle cx="7" cy="12" r="1.2" fill="currentColor"/></svg>'}
];
const REACTION_OPTIONS = [
  {value:'Refused', label:'Refused', cls:'r-refused', icon:'<svg width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="10" r="1.1" fill="currentColor"/><circle cx="15.5" cy="10" r="1.1" fill="currentColor"/><path d="M8 16c1-1.3 2.5-2 4-2s3 0.7 4 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'},
  {value:'Neutral', label:'Neutral', cls:'r-neutral', icon:'<svg width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="10" r="1.1" fill="currentColor"/><circle cx="15.5" cy="10" r="1.1" fill="currentColor"/><path d="M8 15h8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'},
  {value:'Liked', label:'Liked', cls:'r-liked', icon:'<svg width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="10" r="1.1" fill="currentColor"/><circle cx="15.5" cy="10" r="1.1" fill="currentColor"/><path d="M8 14c1 1.6 2.5 2.4 4 2.4s3-0.8 4-2.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'}
];

// ---------------- Sheet state ----------------
let sheetStep = 1;
let selectedFormat = 'soft';
let selectedTs = '';
let allergenUsedFlag = false;

function nowLocalIso(){ return new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16); }

function resetSheetState(prefill){
  editingId = (prefill && prefill.editingId) || null;
  selectedItems = (prefill && prefill.items) ? [...prefill.items] : [];
  selectedFormat = (prefill && prefill.format) || 'soft';
  selectedReaction = (prefill && prefill.reaction) || null;
  selectedSpices = (prefill && Array.isArray(prefill.spices)) ? [...prefill.spices] : [];
  allergenUsedFlag = !!(prefill && prefill.allergenUsed);
  selectedAllergens = (prefill && prefill.allergens) ? [...prefill.allergens] : [];
  selectedAllergenReaction = (prefill && prefill.allergenReaction) || null;
  selectedTs = (prefill && prefill.ts) ? new Date(new Date(prefill.ts) - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : nowLocalIso();
  notesValue = (prefill && prefill.notes) || '';
}
let notesValue = '';

function openSheet(prefill){
  resetSheetState(prefill);
  sheetStep = 1;
  document.getElementById('sheetBackdrop').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  renderSheetStep();
}
function closeSheet(){
  document.getElementById('sheetBackdrop').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}
document.getElementById('sheetCloseBtn').onclick = closeSheet;
document.getElementById('sheetBackdrop').onclick = closeSheet;
document.getElementById('fabBtn').onclick = ()=> openSheet(null);

function renderDots(){
  document.getElementById('sheetDots').innerHTML = [1,2,3].map(n=>'<span class="'+(n===sheetStep?'active':'')+'"></span>').join('');
}

function renderSheetStep(){
  renderDots();
  const body = document.getElementById('sheetBody');
  const footer = document.getElementById('sheetFooter');
  const stats = computeStats();

  if(sheetStep===1){
    body.innerHTML =
      '<div class="sheet-step-title">What did he eat?</div>'+
      '<label>Items (up to 3)</label>'+
      '<div class="chip-group" id="sheetItemChips" style="margin-bottom:16px;"></div>'+
      '<label>Format</label>'+
      '<div class="format-grid" id="sheetFormatGrid"></div>';
    document.getElementById('sheetItemChips').innerHTML = stats.unlockedFoods.map(f=>
      '<button type="button" class="chip'+(selectedItems.includes(f)?' selected':'')+'" data-food="'+escapeHtml(f)+'">'+escapeHtml(f)+'</button>'
    ).join('');
    document.querySelectorAll('#sheetItemChips .chip').forEach(c=>{
      c.onclick = ()=>{
        const f = c.dataset.food;
        if(selectedItems.includes(f)) selectedItems = selectedItems.filter(x=>x!==f);
        else if(selectedItems.length<3) selectedItems.push(f);
        renderSheetStep();
      };
    });
    document.getElementById('sheetFormatGrid').innerHTML = FORMAT_OPTIONS.map(fo=>
      '<button type="button" class="format-card'+(selectedFormat===fo.value?' selected':'')+'" data-fmt="'+fo.value+'">'+
        '<div class="fc-icon">'+fo.icon+'</div>'+
        '<div class="fc-title">'+fo.title+'</div>'+
        '<div class="fc-desc">'+fo.desc+'</div>'+
      '</button>'
    ).join('');
    document.querySelectorAll('#sheetFormatGrid .format-card').forEach(c=>{
      c.onclick = ()=>{ selectedFormat = c.dataset.fmt; renderSheetStep(); };
    });
    footer.innerHTML = '<button class="btn" id="stepNextBtn">Next</button>';
    document.getElementById('stepNextBtn').onclick = ()=>{
      if(!selectedItems.length){ alert('Pick at least one food item.'); return; }
      sheetStep = 2; renderSheetStep();
    };
  }

  else if(sheetStep===2){
    body.innerHTML =
      '<div class="sheet-step-title">How did it go?</div>'+
      '<div class="reaction-grid" id="sheetReactionGrid"></div>'+
      '<label style="margin-top:18px;">Spices used (optional — pick any)</label>'+
      '<div class="chip-group" id="sheetSpiceChips"></div>';
    document.getElementById('sheetReactionGrid').innerHTML = REACTION_OPTIONS.map(ro=>
      '<button type="button" class="reaction-card '+ro.cls+(selectedReaction===ro.value?' selected':'')+'" data-reaction="'+ro.value+'">'+
        '<div class="rc-icon">'+ro.icon+'</div><div class="rc-label">'+ro.label+'</div>'+
      '</button>'
    ).join('');
    document.querySelectorAll('#sheetReactionGrid .reaction-card').forEach(c=>{
      c.onclick = ()=>{ selectedReaction = c.dataset.reaction; renderSheetStep(); };
    });
    document.getElementById('sheetSpiceChips').innerHTML = SPICES.map(sp=>
      '<button type="button" class="chip'+(selectedSpices.includes(sp)?' selected':'')+'" data-sp="'+escapeHtml(sp)+'">'+escapeHtml(sp)+'</button>'
    ).join('');
    document.querySelectorAll('#sheetSpiceChips .chip').forEach(c=>{
      c.onclick = ()=>{
        const n = c.dataset.sp;
        if(selectedSpices.includes(n)) selectedSpices = selectedSpices.filter(x=>x!==n);
        else selectedSpices.push(n);
        renderSheetStep();
      };
    });
    footer.innerHTML = '<button class="btn secondary" id="stepBackBtn">Back</button><button class="btn" id="stepNextBtn">Next</button>';
    document.getElementById('stepBackBtn').onclick = ()=>{ sheetStep=1; renderSheetStep(); };
    document.getElementById('stepNextBtn').onclick = ()=>{
      if(!selectedReaction){ alert('Pick a reaction.'); return; }
      sheetStep = 3; renderSheetStep();
    };
  }

  else if(sheetStep===3){
    body.innerHTML =
      '<div class="sheet-step-title">Anything else?</div>'+
      '<div class="checkbox-row" style="margin-bottom:10px;"><input type="checkbox" id="sheetAllergenCheck"'+(allergenUsedFlag?' checked':'')+'><span>Allergen used?</span></div>'+
      '<div class="sub-fields'+(allergenUsedFlag?' open':'')+'" id="sheetAllergenFields">'+
        '<label>Which allergen(s)</label>'+
        '<div class="chip-group" id="sheetAllergenChips" style="margin-bottom:10px;"></div>'+
        '<label>Any reaction observed?</label>'+
        '<div class="chip-group" id="sheetAllergenReactChips"></div>'+
      '</div>'+
      '<label style="margin-top:14px;">When</label>'+
      '<input type="datetime-local" id="sheetTsInput" value="'+selectedTs+'" style="margin-bottom:14px;">'+
      '<label>Notes</label>'+
      '<textarea id="sheetNotesInput" placeholder="Optional">'+escapeHtml(notesValue)+'</textarea>';

    document.getElementById('sheetAllergenChips').innerHTML = ALLERGENS.map(a=>
      '<button type="button" class="chip'+(selectedAllergens.includes(a.name)?' selected':'')+'" data-al="'+a.name+'">'+a.name+'</button>'
    ).join('');
    document.querySelectorAll('#sheetAllergenChips .chip').forEach(c=>{
      c.onclick = ()=>{
        const n = c.dataset.al;
        if(selectedAllergens.includes(n)) selectedAllergens = selectedAllergens.filter(x=>x!==n);
        else selectedAllergens.push(n);
        renderSheetStep();
      };
    });
    document.getElementById('sheetAllergenReactChips').innerHTML =
      '<button type="button" class="chip'+(selectedAllergenReaction==='fine'?' selected':'')+'" data-ar="fine">No reaction</button>'+
      '<button type="button" class="chip'+(selectedAllergenReaction==='reaction'?' selected':'')+'" data-ar="reaction">Reaction observed</button>';
    document.querySelectorAll('#sheetAllergenReactChips .chip').forEach(c=>{
      c.onclick = ()=>{ selectedAllergenReaction = c.dataset.ar; renderSheetStep(); };
    });
    document.getElementById('sheetAllergenCheck').onchange = e=>{
      allergenUsedFlag = e.target.checked;
      document.getElementById('sheetAllergenFields').classList.toggle('open', allergenUsedFlag);
    };
    document.getElementById('sheetTsInput').oninput = e=>{ selectedTs = e.target.value; };
    document.getElementById('sheetNotesInput').oninput = e=>{ notesValue = e.target.value; };

    footer.innerHTML = '<button class="btn secondary" id="stepBackBtn">Back</button><button class="btn" id="saveBtn">'+(editingId?'Update meal':'Save meal')+'</button>';
    document.getElementById('stepBackBtn').onclick = ()=>{ sheetStep=2; renderSheetStep(); };
    document.getElementById('saveBtn').onclick = saveMeal;
  }
}

async function saveMeal(){
  const payload = {
    ts: selectedTs ? new Date(selectedTs).toISOString() : new Date().toISOString(),
    items: selectedItems,
    format: selectedFormat,
    reaction: selectedReaction,
    spices: selectedSpices,
    allergenUsed: allergenUsedFlag,
    allergens: allergenUsedFlag ? selectedAllergens : [],
    allergenReaction: allergenUsedFlag ? selectedAllergenReaction : null,
    notes: (notesValue||'').trim()
  };
  try{
    if(editingId){ await updateDoc(doc(db,'mealLog',editingId), payload); }
    else { await addDoc(mealsCol, payload); }
    closeSheet();
  }catch(err){ console.error(err); alert('Could not save — check your connection.'); }
}

async function removeEntry(id){
  if(!confirm('Delete this logged meal? This cannot be undone.')) return;
  try{ await deleteDoc(doc(db,'mealLog',id)); }catch(err){ console.error(err); alert('Could not delete — check your connection.'); }
}

// ---------------- Firebase wiring ----------------
onAuthStateChanged(auth, user=>{
  if(!user) return;
  onSnapshot(mealsCol, snap=>{
    entries = snap.docs.map(d=>({id:d.id, ...d.data()}));
    statusEl.textContent = 'live';
    statusEl.className = 'sync-status live';
    renderAll();
  }, err=>{
    statusEl.textContent = 'sync error';
    statusEl.className = 'sync-status err';
    console.error(err);
  });
});
signInAnonymously(auth).catch(err=>{
  statusEl.textContent = 'sync error';
  statusEl.className = 'sync-status err';
  console.error(err);
});
renderAll();
