<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riyaan's Weaning Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#2F4A34;--teal-dark:#2F4A34;--teal-deep:#1D2F21;--teal-light:#9FB79A;--teal-surface:#E7E9DD;
  --burgundy:#A6432E;--burgundy-light:#F1DCD3;--pink:#7C4A32;
  --amber-light:#F3E1BC;--amber-deep:#8C6416;
  --bg-1:#F1EDE1;--bg-2:#E9E3D2;--card:#FBF9F3;--border:#D8D0BC;
  --text:#23301F;--text-muted:#6B6754;
  --shadow-sm:0 1px 0 rgba(35,48,31,0.08);--shadow-md:0 2px 0 rgba(35,48,31,0.1);
}
.a11y-on{
  --teal-dark:#1D2F21;--teal-deep:#122016;--burgundy:#7C2A1A;
  --bg-1:#E4E9DC;--bg-2:#D7DFC9;--card:#F7F8F0;--border:#A9B79A;
  --teal-surface:#CBDAC4;--teal-light:#8CA982;
  --burgundy-light:#E9C9BC;--amber-light:#E9CE8F;
}
.a11y-bar{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:3px;padding:5px 12px;}
.a11y-on .a11y-bar{background:var(--teal-surface);border-color:var(--teal);}
.a11y-label{font-size:10px;font-weight:500;color:var(--text-muted);}
.a11y-on .a11y-label{color:var(--teal-deep);font-weight:600;}
.a11y-sw{position:relative;width:34px;height:18px;background:var(--border);border-radius:9px;cursor:pointer;border:none;padding:0;flex-shrink:0;}
.a11y-sw.on{background:var(--teal-deep);}
.a11y-sw::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:transform .2s;}
.a11y-sw.on::after{transform:translateX(16px);}
.a11y-tag{font-size:8px;font-weight:700;padding:2px 6px;border-radius:3px;text-transform:none;}
.a11y-tag-off{background:var(--bg-2);color:var(--text-muted);}
.a11y-tag-on{background:var(--teal-surface);color:var(--teal-deep);}

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Work Sans',system-ui,sans-serif;background:var(--bg-1);color:var(--text);line-height:1.5;font-size:14px;}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 60px;}
.header-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;padding-bottom:14px;border-bottom:2px solid var(--teal-dark);}
h1{font-family:'Fraunces',serif;font-size:24px;font-weight:600;letter-spacing:-0.01em;}
.sync-status{font-size:9px;font-weight:700;padding:2px 8px;border-radius:3px;background:var(--bg-2);color:var(--text-muted);}
.sync-status.live{background:var(--teal-surface);color:var(--teal-dark);}
.sync-status.err{background:var(--burgundy-light);color:var(--burgundy);}

section{margin-bottom:24px;}
h2{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--teal-dark);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.card{background:var(--card);border-radius:6px;padding:16px 18px;box-shadow:var(--shadow-sm);border:1px solid var(--border);}

/* Next meal */
.next-meal{background:var(--card);border:1px solid var(--teal-dark);border-left:4px solid var(--teal-dark);border-radius:6px;padding:20px;}
.next-meal .stage-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--teal-dark);background:var(--teal-surface);padding:3px 10px;border-radius:3px;margin-bottom:10px;}
.next-meal .items{font-family:'Fraunces',serif;font-size:clamp(18px,4.5vw,22px);font-weight:600;margin-bottom:4px;line-height:1.3;}
.next-meal .meta{font-size:12.5px;color:var(--text-muted);margin-bottom:10px;}
.next-meal .allergen-note{font-size:12.5px;color:var(--burgundy);font-weight:600;margin-bottom:10px;}
.food-link{color:var(--teal-dark);text-decoration:underline;text-decoration-style:dotted;cursor:pointer;background:none;border:none;font:inherit;padding:0;}
.btn{display:inline-block;background:var(--teal-dark);color:#fff;border:none;border-radius:4px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px;}
.btn:hover{background:var(--teal-deep);}
.btn.secondary{background:var(--card);color:var(--teal-dark);border:1px solid var(--teal-dark);}
.btn.danger{background:var(--burgundy-light);color:var(--burgundy);}

/* Recipe panel */
.recipe-panel{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--teal-dark);padding:18px;max-height:60vh;overflow-y:auto;z-index:300;display:none;}
.recipe-panel.open{display:block;}
.recipe-panel h3{font-family:'Fraunces',serif;font-size:17px;color:var(--teal-dark);margin-bottom:8px;}
.recipe-panel .close-btn{float:right;background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-muted);}
.recipe-panel p{font-size:13px;margin-bottom:6px;}

/* Form */
.form-grid{display:grid;gap:12px;}
label{font-size:11.5px;font-weight:600;color:var(--teal-dark);display:block;margin-bottom:5px;}
input,select,textarea{width:100%;font-size:16px;font-family:inherit;padding:9px 10px;border:1px solid var(--border);border-radius:4px;background:var(--bg-1);color:var(--text);}
textarea{resize:vertical;min-height:50px;}
.chip-group{display:flex;flex-wrap:wrap;gap:8px;}
.chip{border:1px solid var(--border);background:var(--bg-1);border-radius:3px;padding:10px 16px;font-size:13.5px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;}
.chip.selected{background:var(--teal-dark);color:#fff;border-color:var(--teal-dark);}
.chip.reaction-liked.selected{background:var(--teal-dark);}
.chip.reaction-refused.selected{background:var(--burgundy);border-color:var(--burgundy);}
.chip.reaction-neutral.selected{background:var(--text-muted);border-color:var(--text-muted);}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13.5px;}
.checkbox-row input{width:auto;min-height:20px;}
.sub-fields{padding:10px;background:var(--bg-1);border-radius:4px;margin-top:6px;display:none;}
.sub-fields.open{display:block;}
.form-actions{display:flex;gap:8px;margin-top:4px;}

/* Progress */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.stat-card{background:var(--card);border-radius:4px;padding:12px 14px;border:1px solid var(--border);border-top:2px solid var(--teal-dark);}
.stat-card .num{font-family:'Fraunces',serif;font-size:clamp(18px,5vw,24px);font-weight:600;color:var(--teal-dark);white-space:nowrap;}
.stat-card .lbl{font-size:11px;color:var(--text-muted);}
.allergen-list{margin-top:10px;font-size:12.5px;}
.allergen-list .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);}
.allergen-list .row:last-child{border-bottom:none;}
.status-pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:3px;}
.status-done{background:var(--teal-surface);color:var(--teal-dark);}
.status-due{background:var(--amber-light);color:var(--amber-deep);}
.status-wait{background:var(--bg-2);color:var(--text-muted);}
.status-alert{background:var(--burgundy-light);color:var(--burgundy);}

/* Shopping */
.shop-list{columns:2;font-size:13px;}
.shop-list div{padding:2px 0;}

/* History */
.hist-entry{background:var(--card);border-radius:4px;padding:10px 14px;border:1px solid var(--border);margin-bottom:8px;font-size:13px;}
.hist-entry .top{display:flex;justify-content:space-between;align-items:center;}
.hist-entry .items{font-weight:600;}
.hist-entry .date{color:var(--text-muted);font-size:11.5px;}
.hist-entry .tags{margin-top:4px;font-size:11.5px;color:var(--text-muted);}
.hist-entry .actions{margin-top:6px;display:flex;gap:6px;}
.hist-entry .actions button{font-size:12.5px;padding:9px 14px;min-height:40px;}
.empty{color:var(--text-muted);font-size:13px;font-style:italic;}
.nav-link{font-size:12.5px;color:var(--teal-dark);text-decoration:none;border-bottom:1px dotted var(--teal-dark);}

@media(max-width:600px){.stat-grid{grid-template-columns:1fr 1fr;}.shop-list{columns:1;}}
</style>
</head>
<body>
<div class="wrap">

<div class="header-bar">
  <h1>Riyaan's Weaning Log</h1>
  <div style="display:flex;align-items:center;gap:12px;">
    <a href="analytics.html" class="nav-link">View analytics &rarr;</a>

    <div class="a11y-bar" id="a11yBar">

<section>

<section>
  <h2>Progress</h2>

</section>

<section>
  <h2>Shopping · next 7 suggested meals</h2>
  <div class="card shop-list" id="shopList"></div>
</section>

<section>
  <h2>History</h2>
  <div id="historyList"></div>
</section>

</div>

<script>
function toggleA11y(){
  const on=document.documentElement.classList.toggle('a11y-on');
  document.getElementById('a11ySw').classList.toggle('on',on);
  const t=document.getElementById('a11yTag');
  t.textContent=on?'On':'Off';
  t.className='a11y-tag '+(on?'a11y-tag-on':'a11y-tag-off');
}
function closeRecipe(){ document.getElementById('recipePanel').classList.remove('open'); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB7jLl4DbwmNVJ_lCDMk6pQCO1ROdpXJZw",
  authDomain: "weaning-plan.firebaseapp.com",
  projectId: "weaning-plan",
  storageBucket: "weaning-plan.firebasestorage.app",
  messagingSenderId: "982823182771",
  appId: "1:982823182771:web:da8686f4e95426a9452bc6"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const mealsCol = collection(db, "mealLog");
const statusEl = document.getElementById('syncStatus');

// ---------------- Reference data ----------------
const FOODS = [
  {name:"Sweet potato", cat:"veg", formats:["soft","finger"], unlockWeek:1, soft:"Steamed and mashed or puréed", finger:"Steamed spear, adult-finger sized"},
  {name:"Potato", cat:"veg", formats:["soft","finger"], unlockWeek:1, soft:"Boiled and mashed", finger:"Boiled wedge"},
  {name:"Carrot", cat:"veg", formats:["soft","finger"], unlockWeek:1, soft:"Steamed and puréed", finger:"Steamed stick, well softened"},
  {name:"Butternut squash", cat:"veg", formats:["soft","finger"], unlockWeek:1, soft:"Roasted and mashed", finger:"Roasted spear"},
  {name:"Parsnip", cat:"veg", formats:["soft","finger"], unlockWeek:1, soft:"Steamed and puréed", finger:"Steamed spear"},
  {name:"Courgette", cat:"veg", formats:["soft","finger"], unlockWeek:1, soft:"Steamed and mashed", finger:"Steamed spear, skin on"},
  {name:"Spinach", cat:"veg", formats:["soft"], unlockWeek:1, soft:"Wilted/steamed, finely puréed or mashed", finger:"Not yet — offer soft wilted strands once pincer grasp is established"},
  {name:"Peas", cat:"veg", formats:["soft","finger"], unlockWeek:2, soft:"Steamed and mashed — squash each pea before serving whole", finger:"Soft-cooked whole peas, squashed, once pincer grip is there"},
  {name:"Green beans", cat:"veg", formats:["soft","finger"], unlockWeek:2, soft:"Steamed and puréed", finger:"Steamed bean, halved lengthways"},
  {name:"Broccoli", cat:"veg", formats:["soft","finger"], unlockWeek:2, soft:"Steamed and mashed", finger:"Steamed floret, stem trimmed"},
  {name:"Cauliflower", cat:"veg", formats:["soft","finger"], unlockWeek:2, soft:"Steamed and puréed", finger:"Steamed floret"},
  {name:"Avocado", cat:"veg", formats:["soft","finger"], unlockWeek:2, soft:"Mashed, no cooking needed", finger:"Ripe spear, skin on as a handle"},
  {name:"Sweetcorn", cat:"veg", formats:["soft","finger"], unlockWeek:2, soft:"Cooked kernels, blended and sieved", finger:"Corn on the cob to gnaw, supervised — not loose kernels"},
  {name:"Red lentil", cat:"legume", formats:["soft"], unlockWeek:2, soft:"Cooked soft and mashed or blended, dal-style", finger:"Not applicable — too small, choking risk whole"},
  {name:"Cabbage", cat:"veg", formats:["soft","finger"], unlockWeek:3, soft:"Steamed until very soft, finely puréed", finger:"Steamed strip, well softened"},
  {name:"Red peppers", cat:"veg", formats:["soft","finger"], unlockWeek:3, soft:"Roasted, skin removed, puréed", finger:"Roasted strip, skin removed"},
  {name:"Beetroot", cat:"veg", formats:["soft","finger"], unlockWeek:3, soft:"Roasted or boiled, puréed", finger:"Roasted spear, cooled and softened"},
  {name:"Aubergine", cat:"veg", formats:["soft","finger"], unlockWeek:3, soft:"Roasted and mashed", finger:"Roasted strip, skin removed"},
  {name:"Chickpea", cat:"legume", formats:["soft"], unlockWeek:3, soft:"Well cooked and mashed", finger:"Not applicable yet — whole chickpeas are a choking hazard"},
  {name:"Butter bean", cat:"legume", formats:["soft"], unlockWeek:3, soft:"Well cooked and mashed", finger:"Not applicable yet"},
  {name:"Rice", cat:"grain", formats:["soft"], unlockWeek:3, soft:"Cooked very soft and slightly sticky, mashed", finger:"Not applicable at this stage"}
];
const ALLERGENS = [
  {name:"Dairy", ingredient:"Plain yoghurt"},
  {name:"Peanut", ingredient:"Peanut butter, smooth"},
  {name:"Wheat", ingredient:"Wheat bread or pasta"},
  {name:"Sesame", ingredient:"Sesame seeds, ground at home"},
  {name:"Soya", ingredient:"Firm tofu"},
  {name:"Tree nut", ingredient:"Cashews, ground at home"}
];
const foodByName = {}; FOODS.forEach(f=>foodByName[f.name]=f);

// ---------------- State ----------------
let entries = [];
let editingId = null;
let selectedItems = [];
let selectedReaction = null;
let selectedAllergens = [];
let selectedAllergenReaction = null;

// ---------------- Derived stats ----------------
function computeStats(){
  const foodExposures = {}; // name -> [{ts, reaction}]
  FOODS.forEach(f=>foodExposures[f.name]=[]);
  const pairs = {}; // "A+B" -> {count, spicedCount, combinedCount, lastPlainReaction, lastSpicedReaction, lastCombinedReaction}
  const allergenLog = {}; // name -> [{ts, reaction}]
  ALLERGENS.forEach(a=>allergenLog[a.name]=[]);

  const sorted = [...entries].sort((a,b)=> new Date(a.ts) - new Date(b.ts));
  sorted.forEach(e=>{
    (e.items||[]).forEach(it=>{ if(foodExposures[it]) foodExposures[it].push({ts:e.ts, reaction:e.reaction}); });
    if(e.items && e.items.length===2){
      const key = [...e.items].sort().join(' + ');
      if(!pairs[key]) pairs[key] = {count:0, spicedCount:0, combinedCount:0, lastPlain:null, lastSpiced:null, lastCombined:null};
      const p = pairs[key];
      if(e.format==='combined'){ p.combinedCount++; p.lastCombined=e.reaction; }
      else if(e.spices){ p.spicedCount++; p.lastSpiced=e.reaction; }
      else { p.count++; p.lastPlain=e.reaction; }
    }
    if(e.allergenUsed && e.allergens){
      e.allergens.forEach(a=>{ if(allergenLog[a]) allergenLog[a].push({ts:e.ts, reaction:e.allergenReaction}); });
    }
  });

  const dayMs = 86400000;
  const now = new Date();
  const acceptance = {};
  FOODS.forEach(f=>{
    const exp = foodExposures[f.name];
    const last2 = exp.slice(-2).map(x=>x.reaction);
    acceptance[f.name] = exp.length>=3 && !last2.includes('Refused');
  });

  const allergenStatus = {};
  ALLERGENS.forEach(a=>{
    const log = allergenLog[a.name];
    const hadReaction = log.some(x=>x.reaction==='reaction');
    let state = 'not-started';
    if(hadReaction) state = 'reaction';
    else if(log.length>=2) state = 'introduced';
    else if(log.length===1) state = 'awaiting-repeat';
    const lastGiven = log.length ? new Date(log[log.length-1].ts) : null;
    const daysSince = lastGiven ? Math.floor((now-lastGiven)/dayMs) : null;
    allergenStatus[a.name] = {state, lastGiven, daysSince, count:log.length};
  });

  // unlock week: based on days since first entry (or today if none)
  const firstTs = sorted.length ? new Date(sorted[0].ts) : now;
  const weeksSinceStart = Math.max(1, Math.floor((now-firstTs)/(7*dayMs))+1);
  const unlockedFoods = FOODS.filter(f=>f.unlockWeek<=weeksSinceStart).map(f=>f.name);

  return {foodExposures, pairs, allergenStatus, acceptance, unlockedFoods, weeksSinceStart};
}

// ---------------- Suggestion engine ----------------
function suggestAllergenAction(stats){
  const order = ALLERGENS.map(a=>a.name);
  // priority 1: any allergen awaiting its day-2 repeat
  for(const name of order){
    if(stats.allergenStatus[name].state==='awaiting-repeat') return {type:'repeat', name};
  }
  // priority 2: maintenance due (introduced, >=3 days since last given)
  const due = order.find(name=>{
    const s = stats.allergenStatus[name];
    return s.state==='introduced' && s.daysSince!==null && s.daysSince>=3;
  });
  if(due) return {type:'maintenance', name:due};
  // priority 3: next new allergen, if last new intro was >=2 days ago (or none started yet)
  const lastIntroDate = order.map(n=>stats.allergenStatus[n]).filter(s=>s.count>0).map(s=>s.lastGiven).sort((a,b)=>b-a)[0];
  const daysSinceLastIntro = lastIntroDate ? Math.floor((new Date()-lastIntroDate)/86400000) : 99;
  if(daysSinceLastIntro>=2){
    const next = order.find(name=>stats.allergenStatus[name].state==='not-started');
    if(next) return {type:'new', name:next};
  }
  return null;
}

function suggestNextMeal(stats){
  const allergenAction = suggestAllergenAction(stats);
  const allergenTag = allergenAction ? (
    allergenAction.type==='repeat' ? 'Repeat allergen (day 2): '+allergenAction.name :
    allergenAction.type==='new' ? 'New allergen to introduce: '+allergenAction.name :
    'Allergen maintenance due: '+allergenAction.name
  ) : null;
  const allergenIngredient = allergenAction ? ALLERGENS.find(a=>a.name===allergenAction.name).ingredient : null;
  const withAllergen = obj => ({...obj, allergenTag, allergenIngredient});

  // Discrete graduation events — always take these immediately, they don't wait their turn
  for(const key in stats.pairs){
    const p = stats.pairs[key];
    const items = key.split(' + ');
    if(p.spicedCount>=3 && p.lastSpiced!=='Refused' && p.combinedCount===0){
      return withAllergen({stage:'Combined dish', items, format:'combined', spiceSuggested:true});
    }
    if(p.count>=3 && p.lastPlain!=='Refused' && p.spicedCount===0){
      return withAllergen({stage:'Spiced pair', items, format:'both', spiceSuggested:true});
    }
  }

  // A pair "in progress" (started but not yet ready to graduate) — at most one should be live at a time
  function findInProgress(){
    for(const key in stats.pairs){
      const p = stats.pairs[key];
      const items = key.split(' + ');
      if(p.spicedCount>=1 && p.combinedCount===0 && !(p.spicedCount>=3 && p.lastSpiced!=='Refused')){
        return {stage:'Spiced pair', items, format:'both', spiceSuggested:true};
      }
    }
    for(const key in stats.pairs){
      const p = stats.pairs[key];
      const items = key.split(' + ');
      if(p.count>=1 && p.spicedCount===0 && !(p.count>=3 && p.lastPlain!=='Refused')){
        return {stage:'Paired', items, format:'both', spiceSuggested:false};
      }
    }
    return null;
  }

  const candidates = stats.unlockedFoods.filter(f=>!stats.acceptance[f]);
  const inProgress = findInProgress();

  // Interleave: don't let pairing crowd out foundation reps for foods that still need them
  if(candidates.length>0){
    const alternateToFoundation = (entries.length % 2 === 0) || !inProgress;
    if(alternateToFoundation){
      candidates.sort((a,b)=> stats.foodExposures[a].length - stats.foodExposures[b].length);
      return withAllergen({stage:'Foundation', items:[candidates[0]], format:'both', spiceSuggested:false});
    }
  }
  if(inProgress) return withAllergen(inProgress);

  // No in-progress pair — start exactly one new pair among accepted foods, prioritising foods with the fewest existing pairings for fairness
  const accepted = stats.unlockedFoods.filter(f=>stats.acceptance[f]);
  const pairCountFor = f => Object.keys(stats.pairs).filter(k=>k.split(' + ').includes(f)).length;
  const byFewestPairs = [...accepted].sort((a,b)=> pairCountFor(a)-pairCountFor(b));
  for(let i=0;i<byFewestPairs.length;i++){
    for(let j=i+1;j<byFewestPairs.length;j++){
      const key = [byFewestPairs[i],byFewestPairs[j]].sort().join(' + ');
      if(!stats.pairs[key]){
        return withAllergen({stage:'Paired', items:[byFewestPairs[i],byFewestPairs[j]], format:'both', spiceSuggested:false});
      }
    }
  }
  if(candidates.length){
    candidates.sort((a,b)=> stats.foodExposures[a].length - stats.foodExposures[b].length);
    return withAllergen({stage:'Foundation', items:[candidates[0]], format:'both', spiceSuggested:false});
  }
  return withAllergen({stage:'All caught up', items:[], format:null, spiceSuggested:false});
}

function projectShoppingList(stats){
  // simulate 7 suggested meals forward using a cloned, mutated copy of stats
  const clone = {foodExposures:Object.fromEntries(Object.entries(stats.foodExposures).map(([k,v])=>[k,v.length])), pairs:JSON.parse(JSON.stringify(stats.pairs)), acceptance:{...stats.acceptance}, unlockedFoods:[...stats.unlockedFoods]};
  const needed = new Set();
  for(let i=0;i<7;i++){
    const fakeStats = {
      foodExposures: Object.fromEntries(Object.entries(clone.foodExposures).map(([k,v])=>[k,Array(v)])),
      pairs: clone.pairs, acceptance: clone.acceptance, unlockedFoods: clone.unlockedFoods,
      allergenStatus: stats.allergenStatus // allergen state held constant for this 7-meal projection — good enough for a shopping list, not meant to simulate exact future allergen timing
    };
    const s = suggestNextMeal(fakeStats);
    s.items.forEach(it=>needed.add(it));
    if(s.allergenIngredient) needed.add(s.allergenIngredient);
    // bump exposure count for suggested items so next iteration differs
    s.items.forEach(it=>{ clone.foodExposures[it] = (clone.foodExposures[it]||0)+1; });
    if(s.items.length===0) break;
  }
  return [...needed];
}

// ---------------- Rendering ----------------
const STAGE_ICONS = {
  'Foundation': '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="16" r="4"/><path d="M12 12V6"/></svg>',
  'Paired': '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9"/><path d="M12 9c0-4 3-6 6-6-1 4-2 6-6 6z"/><path d="M12 13c0-3-2-5-5-5 1 3 2 5 5 5z"/></svg>',
  'Spiced pair': '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V8"/><ellipse cx="12" cy="7" rx="4" ry="5"/></svg>',
  'Combined dish': '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v6"/><path d="M8 8c-2 3-2 7 0 10a5 5 0 008 0c2-3 2-7 0-10"/><path d="M9 9c1.5-2 4.5-2 6 0"/></svg>'
};
function renderNextMeal(stats){
  const s = suggestNextMeal(stats);
  const el = document.getElementById('nextMealCard');
  if(!s.items.length){ el.innerHTML = '<span class="empty">Every unlocked food is accepted and paired — nice work. Check back once more foods unlock.</span>'; return; }
  const itemLinks = s.items.map(it=>'<button class="food-link" data-food="'+escapeHtml(it)+'">'+escapeHtml(it)+'</button>').join(' + ');
  el.innerHTML =
    '<span class="stage-tag">'+(STAGE_ICONS[s.stage]||'')+s.stage+'</span>'+
    '<div class="items">'+itemLinks+'</div>'+
    '<div class="meta">'+(s.spiceSuggested?'Add a mild spice this time. ':'')+'Format: '+s.format+'</div>'+
    (s.allergenTag ? '<div class="allergen-note">'+escapeHtml(s.allergenTag)+'</div>' : '')+
    '<button class="btn" id="prefillBtn">Log this meal</button>';
  document.getElementById('prefillBtn').onclick = ()=>{
    selectedItems = [...s.items];
    document.getElementById('formatSelect').value = s.format==='combined' ? 'combined' : (s.format==='both'?'both':'soft');
    document.getElementById('spicesCheck').checked = !!s.spiceSuggested;
    if(s.allergenTag && s.allergenIngredient){
      document.getElementById('allergenCheck').checked = true;
      document.getElementById('allergenSubFields').classList.add('open');
      const allergenNameMatch = ALLERGENS.find(a=>s.allergenTag.includes(a.name));
      if(allergenNameMatch) selectedAllergens = [allergenNameMatch.name];
    }
    renderItemChips(stats);
    renderAllergenChips();
    document.getElementById('formHeading').scrollIntoView({behavior:'smooth'});
  };
  el.querySelectorAll('.food-link').forEach(b=> b.onclick = ()=>openRecipe(b.dataset.food));
}

function renderStats(stats){
  const acceptedCount = stats.unlockedFoods.filter(f=>stats.acceptance[f]).length;
  const grid = document.getElementById('statGrid');
  grid.innerHTML =
    '<div class="stat-card"><div class="num">'+acceptedCount+'/'+stats.unlockedFoods.length+'</div><div class="lbl">Foods accepted (unlocked)</div></div>'+
    '<div class="stat-card"><div class="num">'+entries.length+'</div><div class="lbl">Meals logged</div></div>'+
    '<div class="stat-card"><div class="num">'+stats.weeksSinceStart+'</div><div class="lbl">Weeks in</div></div>'+
    '<div class="stat-card"><div class="num">'+Object.keys(stats.pairs).length+'</div><div class="lbl">Pairings started</div></div>';

  const al = document.getElementById('allergenStatus');
  al.innerHTML = ALLERGENS.map(a=>{
    const s = stats.allergenStatus[a.name];
    let pill = '<span class="status-pill status-wait">Not started</span>';
    if(s.state==='awaiting-repeat') pill = '<span class="status-pill status-due">Repeat tomorrow</span>';
    if(s.state==='introduced') pill = '<span class="status-pill status-done">Introduced'+(s.daysSince>=3?' — top-up due':'')+'</span>';
    if(s.state==='reaction') pill = '<span class="status-pill status-alert">Reaction noted — see notes</span>';
    return '<div class="row"><span>'+a.name+'</span>'+pill+'</div>';
  }).join('');
}

function renderShopping(stats){
  const items = projectShoppingList(stats);
  const el = document.getElementById('shopList');
  el.innerHTML = items.length ? items.map(i=>'<div>'+escapeHtml(i)+'</div>').join('') : '<span class="empty">Nothing projected yet — log a meal or two first.</span>';
}

function renderHistory(){
  const el = document.getElementById('historyList');
  if(!entries.length){ el.innerHTML = '<span class="empty">No meals logged yet.</span>'; return; }
  const sorted = [...entries].sort((a,b)=> new Date(b.ts)-new Date(a.ts));
  el.innerHTML = sorted.map(e=>{
    const d = new Date(e.ts);
    const dateStr = d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + ' ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    const tags = [e.format, e.reaction, e.spices?'spiced':null, e.allergenUsed?('allergen: '+(e.allergens||[]).join(', ')):null].filter(Boolean).join(' · ');
    return '<div class="hist-entry" data-id="'+e.id+'">'+
      '<div class="top"><span class="items">'+escapeHtml((e.items||[]).join(' + '))+'</span><span class="date">'+dateStr+'</span></div>'+
      '<div class="tags">'+escapeHtml(tags)+(e.notes?(' · '+escapeHtml(e.notes)):'')+'</div>'+
      '<div class="actions"><button class="btn secondary" data-edit="'+e.id+'">Edit</button><button class="btn danger" data-del="'+e.id+'">Delete</button></div>'+
    '</div>';
  }).join('');
  el.querySelectorAll('[data-edit]').forEach(b=> b.onclick = ()=>startEdit(b.dataset.edit));
  el.querySelectorAll('[data-del]').forEach(b=> b.onclick = ()=>removeEntry(b.dataset.del));
}

function renderItemChips(stats){
  const el = document.getElementById('itemChips');
  el.innerHTML = stats.unlockedFoods.map(f=>
    '<button type="button" class="chip'+(selectedItems.includes(f)?' selected':'')+'" data-food="'+escapeHtml(f)+'">'+escapeHtml(f)+'</button>'
  ).join('');
  el.querySelectorAll('.chip').forEach(c=>{
    c.onclick = ()=>{
      const f = c.dataset.food;
      if(selectedItems.includes(f)) selectedItems = selectedItems.filter(x=>x!==f);
      else if(selectedItems.length<3) selectedItems.push(f);
      renderItemChips(stats);
    };
  });
}
function renderAllergenChips(){
  const el = document.getElementById('allergenChips');
  el.innerHTML = ALLERGENS.map(a=>
    '<button type="button" class="chip'+(selectedAllergens.includes(a.name)?' selected':'')+'" data-al="'+a.name+'">'+a.name+'</button>'
  ).join('');
  el.querySelectorAll('.chip').forEach(c=>{
    c.onclick = ()=>{
      const n = c.dataset.al;
      if(selectedAllergens.includes(n)) selectedAllergens = selectedAllergens.filter(x=>x!==n);
      else selectedAllergens.push(n);
      renderAllergenChips();
    };
  });
}

function openRecipe(foodName){
  const f = foodByName[foodName];
  if(!f) return;
  document.getElementById('recipeContent').innerHTML =
    '<h3>'+escapeHtml(f.name)+'</h3>'+
    '<p><b>Soft:</b> '+escapeHtml(f.soft)+'</p>'+
    '<p><b>Finger:</b> '+escapeHtml(f.finger)+'</p>';
  document.getElementById('recipePanel').classList.add('open');
}
window.closeRecipe = closeRecipe;

function renderAll(){
  const stats = computeStats();
  renderNextMeal(stats);
  renderStats(stats);
  renderShopping(stats);
  renderHistory();
  renderItemChips(stats);
  renderAllergenChips();
}

// ---------------- Form wiring ----------------
document.querySelectorAll('[data-reaction]').forEach(b=>{
  b.onclick = ()=>{
    selectedReaction = b.dataset.reaction;
    document.querySelectorAll('[data-reaction]').forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected');
  };
});
document.querySelectorAll('[data-allreact]').forEach(b=>{
  b.onclick = ()=>{
    selectedAllergenReaction = b.dataset.allreact;
    document.querySelectorAll('[data-allreact]').forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected');
  };
});
document.getElementById('allergenCheck').addEventListener('change', e=>{
  document.getElementById('allergenSubFields').classList.toggle('open', e.target.checked);
});

function resetForm(){
  editingId = null;
  selectedItems = []; selectedReaction = null; selectedAllergens = []; selectedAllergenReaction = null;
  document.getElementById('formatSelect').value = 'soft';
  document.getElementById('spicesCheck').checked = false;
  document.getElementById('allergenCheck').checked = false;
  document.getElementById('allergenSubFields').classList.remove('open');
  document.getElementById('notesInput').value = '';
  document.querySelectorAll('[data-reaction],[data-allreact]').forEach(x=>x.classList.remove('selected'));
  document.getElementById('tsInput').value = new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
  document.getElementById('cancelEditBtn').style.display = 'none';
  document.getElementById('saveBtn').textContent = 'Save meal';
  const stats = computeStats();
  renderItemChips(stats);
  renderAllergenChips();
}
resetForm();

function startEdit(id){
  const e = entries.find(x=>x.id===id);
  if(!e) return;
  editingId = id;
  selectedItems = [...(e.items||[])];
  selectedReaction = e.reaction;
  selectedAllergens = [...(e.allergens||[])];
  selectedAllergenReaction = e.allergenReaction || null;
  document.getElementById('formatSelect').value = e.format || 'soft';
  document.getElementById('spicesCheck').checked = !!e.spices;
  document.getElementById('allergenCheck').checked = !!e.allergenUsed;
  document.getElementById('allergenSubFields').classList.toggle('open', !!e.allergenUsed);
  document.getElementById('notesInput').value = e.notes || '';
  document.querySelectorAll('[data-reaction]').forEach(x=>x.classList.toggle('selected', x.dataset.reaction===selectedReaction));
  document.querySelectorAll('[data-allreact]').forEach(x=>x.classList.toggle('selected', x.dataset.allreact===selectedAllergenReaction));
  const d = new Date(e.ts);
  document.getElementById('tsInput').value = new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,16);
  document.getElementById('cancelEditBtn').style.display = 'inline-block';
  document.getElementById('saveBtn').textContent = 'Update meal';
  const stats = computeStats();
  renderItemChips(stats);
  renderAllergenChips();
  document.getElementById('formHeading').scrollIntoView({behavior:'smooth'});
}
document.getElementById('cancelEditBtn').onclick = resetForm;

async function removeEntry(id){
  if(!confirm('Delete this logged meal? This cannot be undone.')) return;
  try{ await deleteDoc(doc(db,'mealLog',id)); }catch(err){ console.error(err); alert('Could not delete — check your connection.'); }
}

document.getElementById('saveBtn').onclick = async ()=>{
  if(!selectedItems.length){ alert('Pick at least one food item.'); return; }
  if(!selectedReaction){ alert('Pick a reaction.'); return; }
  const tsVal = document.getElementById('tsInput').value;
  const payload = {
    ts: tsVal ? new Date(tsVal).toISOString() : new Date().toISOString(),
    items: selectedItems,
    format: document.getElementById('formatSelect').value,
    reaction: selectedReaction,
    spices: document.getElementById('spicesCheck').checked,
    allergenUsed: document.getElementById('allergenCheck').checked,
    allergens: document.getElementById('allergenCheck').checked ? selectedAllergens : [],
    allergenReaction: document.getElementById('allergenCheck').checked ? selectedAllergenReaction : null,
    notes: document.getElementById('notesInput').value.trim()
  };
  try{
    if(editingId){ await updateDoc(doc(db,'mealLog',editingId), payload); }
    else { await addDoc(mealsCol, payload); }
    resetForm();
  }catch(err){ console.error(err); alert('Could not save — check your connection.'); }
};

// ---------------- Firebase wiring ----------------
onAuthStateChanged(auth, user=>{
  if(!user) return;
  onSnapshot(mealsCol, snap=>{
    entries = snap.docs.map(d=>({id:d.id, ...d.data()}));
    statusEl.textContent = 'live';
    statusEl.className = 'sync-status live';
    renderAll();
  }, err=>{
    statusEl.textContent = 'sync error';
    statusEl.className = 'sync-status err';
    console.error(err);
  });
});
signInAnonymously(auth).catch(err=>{
  statusEl.textContent = 'sync error';
  statusEl.className = 'sync-status err';
  console.error(err);
});
renderAll();
</script>
</body>
