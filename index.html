<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riyaan's Weaning — Field Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#FF6B57; --indigo:#6C63FF; --amber:#F5A623; --teal:#17A6A6; --emerald:#1DA55E;
  --root:#C96A2E; --leafy:#3FAE6A; --garden:#D6336C; --legume:#C99A2E; --spice:#8E4CC1; --allergenc:#2E9CD6;
  --bg:#FAFAF8; --card:#FFFFFF; --border:#ECEAE3;
  --text:#20232B; --text-muted:#767B87;
  --burgundy:#D6336C; --burgundy-light:#FBE1E9;
  --shadow-sm:0 1px 3px rgba(32,35,43,0.06); --shadow-md:0 4px 16px rgba(32,35,43,0.09);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:14px;}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px;}
.header-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:10px;}
h1{font-family:'Baloo 2',sans-serif;font-size:23px;font-weight:800;}
.subtitle{color:var(--text-muted);font-size:13px;margin:8px 0 18px;}
.nav-link{font-size:12.5px;color:var(--indigo);text-decoration:none;font-weight:700;}
.sync-status{font-size:9px;font-weight:800;padding:3px 9px;border-radius:20px;background:var(--border);color:var(--text-muted);}
.sync-status.live{background:var(--emerald);color:#fff;}
.sync-status.err{background:var(--burgundy);color:#fff;}

/* Tabs */
.tab-nav{display:flex;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:5px;box-shadow:var(--shadow-sm);margin-bottom:18px;overflow-x:auto;}
.tab-btn{border:none;background:transparent;font-family:'Baloo 2',sans-serif;font-size:13px;font-weight:700;color:var(--text-muted);padding:9px 16px;border-radius:12px;cursor:pointer;white-space:nowrap;transition:background 0.2s, color 0.2s;}
.tab-btn.active{background:var(--indigo);color:#fff;}
.tab-panel{display:none;}
.tab-panel.pre-in{display:block;opacity:0;transform:translateY(10px);}
.tab-panel.in{display:block;opacity:1;transform:translateY(0);transition:opacity 0.28s ease, transform 0.28s ease;}

section{margin-bottom:22px;}
.section-label{font-family:'Baloo 2',sans-serif;font-size:14px;font-weight:700;color:var(--text-muted);margin-bottom:9px;padding-left:2px;}
.card{background:var(--card);border-radius:18px;padding:16px 18px;border:1px solid var(--border);box-shadow:var(--shadow-sm);}
.hero-card{border-radius:24px;padding:20px;color:#fff;box-shadow:var(--shadow-md);}
.hero-card.c-indigo{background:var(--indigo);}
.hero-card.c-amber{background:var(--amber);}

.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.stat-pill{background:rgba(255,255,255,0.18);border-radius:14px;padding:11px 14px;}
.stat-pill .num{font-family:'Baloo 2',sans-serif;font-size:clamp(18px,5vw,23px);font-weight:800;color:#fff;white-space:nowrap;}
.stat-pill .lbl{font-size:10.5px;color:#fff;opacity:0.85;}

/* Group breakdown bars */
.group-row{display:flex;align-items:center;gap:10px;padding:9px 0;}
.group-row .gname{width:110px;font-size:12.5px;font-weight:800;flex-shrink:0;}
.group-track{flex:1;height:14px;background:var(--border);border-radius:8px;overflow:hidden;}
.group-fill{height:100%;border-radius:8px;width:0;transition:width 0.7s cubic-bezier(.2,.8,.3,1);}
.group-count{width:44px;text-align:right;font-family:'Baloo 2',sans-serif;font-size:13px;font-weight:700;flex-shrink:0;}

/* Reaction breakdown */
.food-group-heading{font-size:11px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:0.04em;padding:5px 12px;border-radius:20px;display:inline-block;margin:14px 0 8px;}
.food-group-heading:first-child{margin-top:0;}
.reaction-row{display:flex;align-items:center;gap:10px;padding:6px 0;}
.reaction-row .fname{width:130px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px;flex-shrink:0;}
.reaction-track{flex:1;height:14px;background:var(--border);border-radius:8px;overflow:hidden;}
.reaction-bar{display:flex;height:100%;width:0;border-radius:8px;overflow:hidden;transition:width 0.6s cubic-bezier(.2,.8,.3,1);}
.reaction-bar div{height:100%;}
.reaction-counts{font-size:10.5px;color:var(--text-muted);text-align:right;white-space:nowrap;width:56px;flex-shrink:0;}
.legend{display:flex;gap:16px;font-size:11px;color:var(--text-muted);margin-top:12px;flex-wrap:wrap;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}

/* Trend chart */
.trend-svg{width:100%;height:auto;}
.trend-bar{fill:var(--amber);}
.trend-axis{stroke:rgba(255,255,255,0.3);stroke-width:1;}
.trend-label{font-size:9px;fill:#fff;opacity:0.85;font-family:'Nunito Sans',sans-serif;}

/* Allergen timeline */
.allergen-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.allergen-row:last-child{border-bottom:none;}
.allergen-order{font-family:'Baloo 2',sans-serif;font-size:13px;color:var(--text-muted);width:18px;}
.allergen-name{font-weight:800;flex:1;font-size:13.5px;display:flex;align-items:center;gap:8px;}
.status-pill{font-size:10px;font-weight:800;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.status-done{background:#E4F7EC;color:var(--emerald);}
.status-due{background:#FDF0DC;color:#8C6416;}
.status-wait{background:var(--border);color:var(--text-muted);}
.status-alert{background:var(--burgundy-light);color:var(--burgundy);}
.allergen-meta{font-size:11px;color:var(--text-muted);width:110px;text-align:right;}

/* Funnel */
.funnel-stage{margin-bottom:18px;}
.funnel-stage-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.funnel-stage-name{font-family:'Baloo 2',sans-serif;font-size:15px;font-weight:700;}
.funnel-stage-count{font-size:11.5px;color:var(--text-muted);}
.funnel-badges{display:flex;flex-wrap:wrap;gap:8px;}
.funnel-pair{display:flex;align-items:center;gap:2px;background:var(--bg);border-radius:20px;padding:4px 10px 4px 4px;}
.funnel-more{font-size:11.5px;color:var(--text-muted);align-self:center;padding:4px 8px;}

.empty{color:var(--text-muted);font-size:13px;font-style:italic;}
@media(max-width:600px){.reaction-row .fname{width:96px;}.group-row .gname{width:88px;}}
</style>
</head>
<body>
<div class="wrap">

<div class="header-bar">
  <h1>Field Notes</h1>
  <div style="display:flex;align-items:center;gap:12px;">
    <a href="index.html" class="nav-link">&larr; Back to log</a>
    <span id="syncStatus" class="sync-status">connecting&hellip;</span>
  </div>
</div>
<p class="subtitle">Riyaan's weaning journey, read live from the same log as the meal tracker.</p>

<div class="tab-nav" id="tabNav">
  <button class="tab-btn active" data-tab="overview">Overview</button>
  <button class="tab-btn" data-tab="byfood">By food</button>
  <button class="tab-btn" data-tab="allergens">Allergens</button>
  <button class="tab-btn" data-tab="progression">Progression</button>
</div>

<div id="panel-overview" class="tab-panel"></div>
<div id="panel-byfood" class="tab-panel"></div>
<div id="panel-allergens" class="tab-panel"></div>
<div id="panel-progression" class="tab-panel"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB7jLl4DbwmNVJ_lCDMk6pQCO1ROdpXJZw",
  authDomain: "weaning-plan.firebaseapp.com",
  projectId: "weaning-plan",
  storageBucket: "weaning-plan.firebasestorage.app",
  messagingSenderId: "982823182771",
  appId: "1:982823182771:web:da8686f4e95426a9452bc6"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const mealsCol = collection(db, "mealLog");
const statusEl = document.getElementById('syncStatus');

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ==================== Colour + icon system (kept in sync with index.html) ====================
const GROUP_COLORS = { root:"#C96A2E", leafy:"#3FAE6A", garden:"#D6336C", legume:"#C99A2E", spice:"#8E4CC1", allergen:"#2E9CD6", dairy:"#C9A876", fruit:"#F4C430", carb:"#7C8FA6" };
const GROUP_LABELS = { root:"Root veg", leafy:"Leafy & green veg", garden:"Garden veg", legume:"Legumes", carb:"Carbs & grains", dairy:"Dairy", fruit:"Fruit (dessert)" };

const FOODS = [
  {name:"Sweet potato", group:"root"}, {name:"Potato", group:"root"}, {name:"Carrot", group:"root"}, {name:"Parsnip", group:"root"}, {name:"Beetroot", group:"root"}, {name:"Swede", group:"root"},
  {name:"Spinach", group:"leafy"}, {name:"Broccoli", group:"leafy"}, {name:"Cabbage", group:"leafy"}, {name:"Peas", group:"leafy"}, {name:"Green beans", group:"leafy"}, {name:"Courgette", group:"leafy"}, {name:"Asparagus", group:"leafy"}, {name:"Brussels sprouts", group:"leafy"}, {name:"Kale", group:"leafy"},
  {name:"Red peppers", group:"garden"}, {name:"Aubergine", group:"garden"}, {name:"Sweetcorn", group:"garden"}, {name:"Avocado", group:"garden"}, {name:"Butternut squash", group:"garden"}, {name:"Cauliflower", group:"garden"}, {name:"Mushroom", group:"garden"}, {name:"Onion", group:"garden"}, {name:"Tomato", group:"garden"},
  {name:"Red lentil", group:"legume"}, {name:"Chickpea", group:"legume"}, {name:"Butter bean", group:"legume"}, {name:"Black beans", group:"legume"}, {name:"Kidney beans", group:"legume"}, {name:"Cannellini beans", group:"legume"}, {name:"Chia seeds", group:"legume"}, {name:"Flaxseed", group:"legume"},
  {name:"Rice", group:"carb"}, {name:"Oats", group:"carb"}, {name:"Quinoa", group:"carb"}, {name:"Amaranth", group:"carb"}, {name:"Barley", group:"carb"}, {name:"Bread/toast", group:"carb", allergenLink:"Wheat"}, {name:"Cornmeal/polenta", group:"carb"}, {name:"Couscous", group:"carb", allergenLink:"Wheat"}, {name:"Crumpets", group:"carb", allergenLink:"Wheat"}, {name:"Fusilli", group:"carb", allergenLink:"Wheat"}, {name:"Gnocchi", group:"carb", allergenLink:"Wheat"}, {name:"Noodles", group:"carb", allergenLink:"Wheat"}, {name:"Orzo", group:"carb", allergenLink:"Wheat"}, {name:"Pancakes", group:"carb", allergenLink:"Wheat"}, {name:"Pastry", group:"carb", allergenLink:"Wheat"}, {name:"Penne", group:"carb", allergenLink:"Wheat"}, {name:"Pitta", group:"carb", allergenLink:"Wheat"}, {name:"Spaghetti", group:"carb", allergenLink:"Wheat"}, {name:"Wraps", group:"carb", allergenLink:"Wheat"},
  {name:"Yoghurt", group:"dairy", allergenLink:"Dairy"}, {name:"Cheese", group:"dairy", allergenLink:"Dairy"}, {name:"Butter/Ghee", group:"dairy", allergenLink:"Dairy"}
];
const FRUITS = [
  {name:"Apple", group:"fruit"}, {name:"Banana", group:"fruit"}, {name:"Pear", group:"fruit"}, {name:"Blueberries", group:"fruit"}, {name:"Strawberries", group:"fruit"},
  {name:"Mango", group:"fruit"}, {name:"Melon", group:"fruit"}, {name:"Kiwi", group:"fruit"}, {name:"Plum", group:"fruit"}, {name:"Orange", group:"fruit"}
];
const ALLERGENS = [
  {name:"Dairy", group:"allergen", ingredient:"Plain yoghurt"}, {name:"Peanut", group:"allergen", ingredient:"Peanut butter, smooth"},
  {name:"Wheat", group:"allergen", ingredient:"Wheat bread or pasta"}, {name:"Sesame", group:"allergen", ingredient:"Sesame seeds, ground at home"},
  {name:"Soya", group:"allergen", ingredient:"Firm tofu"}, {name:"Tree nut", group:"allergen", ingredient:"Cashews, ground at home"}
];
const foodByName = {}; [...FOODS, ...FRUITS].forEach(f=>foodByName[f.name]=f);
const allergenByName = {}; ALLERGENS.forEach(a=>allergenByName[a.name]=a);

function badgeSvg(name, size){
  const def = foodByName[name] || allergenByName[name];
  const group = def ? def.group : 'spice';
  const color = GROUP_COLORS[group] || '#999';
  const letter = name.replace(/\(.*?\)/g,'').trim()[0].toUpperCase();
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 100 100" style="flex-shrink:0;"><circle cx="50" cy="50" r="50" fill="'+color+'"/>'+
    '<text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-family="Baloo 2, sans-serif" font-weight="700" font-size="48" fill="#fff">'+escapeHtml(letter)+'</text></svg>';
}

let entries = [];

function computeStats(){
  const allTrackable = [...FOODS, ...FRUITS];
  const foodExposures = {}; allTrackable.forEach(f=>foodExposures[f.name]=[]);
  const pairs = {};
  const allergenLog = {}; ALLERGENS.forEach(a=>allergenLog[a.name]=[]);
  const sorted = [...entries].sort((a,b)=> new Date(a.ts) - new Date(b.ts));
  sorted.forEach(e=>{
    (e.items||[]).forEach(it=>{ if(foodExposures[it]) foodExposures[it].push({ts:e.ts, reaction:e.reaction}); });
    if(e.items && e.items.length===2){
      const key = [...e.items].sort().join(' + ');
      if(!pairs[key]) pairs[key] = {items:[...e.items].sort(), count:0, spicedCount:0, combinedCount:0, lastPlain:null, lastSpiced:null};
      const p = pairs[key];
      if(e.format==='combined'){ p.combinedCount++; }
      else if(e.spices && e.spices.length){ p.spicedCount++; p.lastSpiced=e.reaction; }
      else { p.count++; p.lastPlain=e.reaction; }
    }
    if(e.allergenUsed && e.allergens){ e.allergens.forEach(a=>{ if(allergenLog[a]) allergenLog[a].push({ts:e.ts, reaction:e.allergenReaction}); }); }
  });
  const acceptance = {};
  allTrackable.forEach(f=>{
    const exp = foodExposures[f.name];
    const last2 = exp.slice(-2).map(x=>x.reaction);
    acceptance[f.name] = exp.length>=3 && !last2.includes('Refused');
  });
  const now = new Date(); const dayMs = 86400000;
  const allergenStatus = {};
  ALLERGENS.forEach(a=>{
    const log = allergenLog[a.name];
    const hadReaction = log.some(x=>x.reaction==='reaction');
    let state = 'not-started';
    if(hadReaction) state='reaction'; else if(log.length>=2) state='introduced'; else if(log.length===1) state='awaiting-repeat';
    let lastGiven = log.length ? new Date(log[log.length-1].ts) : null;
    // Once safely introduced, any food already linked to this allergen (e.g. toast for
    // Wheat) also refreshes "last given" for maintenance purposes — mirrors index.html.
    if(state==='introduced'){
      const linkedFoods = FOODS.filter(f=>f.allergenLink===a.name).map(f=>f.name);
      if(linkedFoods.length){
        sorted.forEach(e=>{
          if((e.items||[]).some(it=>linkedFoods.includes(it))){
            const d = new Date(e.ts);
            if(!lastGiven || d>lastGiven) lastGiven = d;
          }
        });
      }
    }
    const daysSince = lastGiven ? Math.floor((now-lastGiven)/dayMs) : null;
    allergenStatus[a.name] = {state, daysSince, count:log.length};
  });
  const acceptedCoreCount = FOODS.filter(f=>acceptance[f.name]).length;
  const fruitsUnlocked = FOODS.length>0 && (acceptedCoreCount/FOODS.length) >= 0.8;
  return {foodExposures, pairs, acceptance, allergenStatus, sortedEntries:sorted, fruitsUnlocked};
}

// ==================== Tab 1: Overview ====================
function renderOverview(stats){
  const acceptedCount = FOODS.filter(f=>stats.acceptance[f.name]).length;
  const groups = ['root','leafy','garden','legume','carb','dairy'];
  const groupRows = groups.map(g=>{
    const foods = FOODS.filter(f=>f.group===g);
    const accepted = foods.filter(f=>stats.acceptance[f.name]).length;
    const pct = foods.length ? (accepted/foods.length*100) : 0;
    return {g, label:GROUP_LABELS[g], accepted, total:foods.length, pct};
  });
  if(stats.fruitsUnlocked){
    const fruitAccepted = FRUITS.filter(f=>stats.acceptance[f.name]).length;
    groupRows.push({g:'fruit', label:GROUP_LABELS.fruit, accepted:fruitAccepted, total:FRUITS.length, pct: FRUITS.length ? (fruitAccepted/FRUITS.length*100) : 0});
  }

  let trendSvg = '<span class="empty" style="color:#fff;">No meals logged yet.</span>';
  if(stats.sortedEntries.length){
    const first = new Date(stats.sortedEntries[0].ts);
    const weekOf = d => Math.floor((new Date(d)-first)/(7*86400000));
    const counts = {};
    stats.sortedEntries.forEach(e=>{ const w = weekOf(e.ts); counts[w]=(counts[w]||0)+1; });
    const maxWeek = Math.max(...Object.keys(counts).map(Number));
    const bars = []; for(let w=0; w<=maxWeek; w++) bars.push(counts[w]||0);
    const maxVal = Math.max(...bars, 1);
    const barW = Math.max(18, Math.min(40, 600/bars.length));
    const gap = 6;
    const chartW = bars.length*(barW+gap);
    const chartH = 100;
    trendSvg = '<svg class="trend-svg" viewBox="0 0 '+chartW+' '+(chartH+20)+'" xmlns="http://www.w3.org/2000/svg"><line x1="0" y1="'+chartH+'" x2="'+chartW+'" y2="'+chartH+'" class="trend-axis"/>'+
      bars.map((v,i)=>{
        const h = (v/maxVal)*(chartH-10);
        const x = i*(barW+gap);
        return '<rect class="trend-bar" data-h="'+h+'" x="'+x+'" y="'+chartH+'" width="'+barW+'" height="0" rx="3"/>'+
               '<text class="trend-label" x="'+(x+barW/2)+'" y="'+(chartH+14)+'" text-anchor="middle">W'+(i+1)+'</text>';
      }).join('')+'</svg>';
  }

  document.getElementById('panel-overview').innerHTML =
    '<section><div class="hero-card c-indigo"><div class="stat-grid">'+
      '<div class="stat-pill"><div class="num">'+acceptedCount+'/'+FOODS.length+'</div><div class="lbl">Foods accepted</div></div>'+
      '<div class="stat-pill"><div class="num">'+entries.length+'</div><div class="lbl">Meals logged</div></div>'+
      '<div class="stat-pill"><div class="num">'+Object.keys(stats.pairs).length+'</div><div class="lbl">Pairings started</div></div>'+
      '<div class="stat-pill"><div class="num">'+Object.values(stats.pairs).filter(p=>p.combinedCount>0).length+'</div><div class="lbl">Combined dishes</div></div>'+
    '</div></div></section>'+
    '<section><div class="section-label">Acceptance by food group</div><div class="card">'+
      groupRows.map(r=>
        '<div class="group-row"><span class="gname">'+r.label+'</span><div class="group-track"><div class="group-fill" data-pct="'+r.pct+'" style="background:'+GROUP_COLORS[r.g]+'"></div></div><span class="group-count">'+r.accepted+'/'+r.total+'</span></div>'
      ).join('')+
    '</div></section>'+
    '<section><div class="section-label">Meals logged per week</div><div class="hero-card c-amber">'+trendSvg+'</div></section>';

  requestAnimationFrame(()=>{
    document.querySelectorAll('.group-fill').forEach(el=>{ el.style.width = el.dataset.pct+'%'; });
    document.querySelectorAll('.trend-bar').forEach(el=>{
      const h = parseFloat(el.dataset.h);
      const y = parseFloat(el.getAttribute('y')) - h;
      el.style.transition = 'height 0.6s cubic-bezier(.2,.8,.3,1), y 0.6s cubic-bezier(.2,.8,.3,1)';
      el.setAttribute('height', h);
      el.setAttribute('y', y);
    });
  });
}

// ==================== Tab 2: By food ====================
function renderByFood(stats){
  const groups = ['root','leafy','garden','legume','carb','dairy'];
  const allRows = [];
  groups.forEach(g=>{
    FOODS.filter(f=>f.group===g).forEach(f=>{
      const exp = stats.foodExposures[f.name];
      if(!exp.length) return;
      allRows.push({
        name:f.name, group:g,
        liked: exp.filter(x=>x.reaction==='Liked').length,
        neutral: exp.filter(x=>x.reaction==='Neutral').length,
        refused: exp.filter(x=>x.reaction==='Refused').length,
        total: exp.length
      });
    });
  });
  if(stats.fruitsUnlocked){
    FRUITS.forEach(f=>{
      const exp = stats.foodExposures[f.name];
      if(!exp.length) return;
      allRows.push({
        name:f.name, group:'fruit',
        liked: exp.filter(x=>x.reaction==='Liked').length,
        neutral: exp.filter(x=>x.reaction==='Neutral').length,
        refused: exp.filter(x=>x.reaction==='Refused').length,
        total: exp.length
      });
    });
  }
  const maxTotal = Math.max(...allRows.map(r=>r.total), 1);

  let html = '';
  const groupOrder = stats.fruitsUnlocked ? [...groups,'fruit'] : groups;
  groupOrder.forEach(g=>{
    const foods = allRows.filter(r=>r.group===g).sort((a,b)=>b.total-a.total);
    if(!foods.length) return;
    html += '<div class="food-group-heading" style="background:'+GROUP_COLORS[g]+'">'+GROUP_LABELS[g]+'</div>';
    html += foods.map(r=>{
      const segPct = x => (x/r.total*100); // proportion WITHIN this food's own bar
      const barPct = (r.total/maxTotal*100); // this food's bar length relative to the most-tried food
      return '<div class="reaction-row"><span class="fname">'+badgeSvg(r.name,22)+escapeHtml(r.name)+'</span>'+
        '<div class="reaction-track"><div class="reaction-bar" data-barw="'+barPct+'">'+
          (r.liked?'<div style="width:'+segPct(r.liked)+'%;background:var(--emerald)"></div>':'')+
          (r.neutral?'<div style="width:'+segPct(r.neutral)+'%;background:var(--text-muted)"></div>':'')+
          (r.refused?'<div style="width:'+segPct(r.refused)+'%;background:var(--burgundy)"></div>':'')+
        '</div></div><span class="reaction-counts">'+r.total+' tried</span></div>';
    }).join('');
  });
  if(!html) html = '<span class="empty">No meals logged yet.</span>';
  document.getElementById('panel-byfood').innerHTML =
    '<section><div class="card">'+html+
      '<div class="legend"><span><i style="background:var(--emerald)"></i>Liked</span><span><i style="background:var(--text-muted)"></i>Neutral</span><span><i style="background:var(--burgundy)"></i>Refused</span></div>'+
    '</div></section>';
  requestAnimationFrame(()=>{
    document.querySelectorAll('#panel-byfood .reaction-bar').forEach(el=>{ el.style.width = el.dataset.barw+'%'; });
  });
}

// ==================== Tab 3: Allergens ====================
function renderAllergens(stats){
  document.getElementById('panel-allergens').innerHTML =
    '<section><div class="card">'+
      ALLERGENS.map((a,i)=>{
        const s = stats.allergenStatus[a.name];
        let pill = '<span class="status-pill status-wait">Not started</span>', meta = '';
        if(s.state==='awaiting-repeat') pill = '<span class="status-pill status-due">Repeat tomorrow</span>';
        if(s.state==='introduced'){ pill = '<span class="status-pill status-done">Introduced</span>'; meta = s.daysSince+' day'+(s.daysSince===1?'':'s')+' since last'; if(s.daysSince>=3) pill = '<span class="status-pill status-due">Top-up due</span>'; }
        if(s.state==='reaction') pill = '<span class="status-pill status-alert">Reaction noted</span>';
        return '<div class="allergen-row"><span class="allergen-order">'+(i+1)+'</span><span class="allergen-name">'+badgeSvg(a.name,26)+a.name+'</span>'+pill+'<span class="allergen-meta">'+meta+'</span></div>';
      }).join('')+
    '</div></section>';
}

// ==================== Tab 4: Progression ====================
function pairBadgeHtml(items){
  return '<span class="funnel-pair">'+items.map(n=>badgeSvg(n,26)).join('')+'</span>';
}
function renderProgression(stats){
  const foundation = FOODS.filter(f=>!stats.acceptance[f.name]);
  const pairsArr = Object.values(stats.pairs);
  const paired = pairsArr.filter(p=>p.count>0 && p.spicedCount===0);
  const spiced = pairsArr.filter(p=>p.spicedCount>0 && p.combinedCount===0);
  const combined = pairsArr.filter(p=>p.combinedCount>0);

  function stageBlock(name, color, list, isFoodList){
    const items = isFoodList ? list.map(f=>f.name) : list.map(p=>p.items);
    const shown = items.slice(0,8);
    const more = items.length-8;
    const badges = isFoodList
      ? shown.map(n=>badgeSvg(n,30)).join('')
      : shown.map(pair=>pairBadgeHtml(pair)).join('');
    return '<div class="funnel-stage"><div class="funnel-stage-head"><span class="funnel-stage-name" style="color:'+color+'">'+name+'</span><span class="funnel-stage-count">'+items.length+'</span></div>'+
      '<div class="funnel-badges">'+(items.length ? badges+(more>0?'<span class="funnel-more">+'+more+' more</span>':'') : '<span class="empty">None yet</span>')+'</div></div>';
  }

  let dessertBlock = '';
  if(stats.fruitsUnlocked){
    const fruitAccepted = FRUITS.filter(f=>stats.acceptance[f.name]);
    dessertBlock = stageBlock('Dessert (fruit accepted)', GROUP_COLORS.fruit, fruitAccepted, true);
  }

  document.getElementById('panel-progression').innerHTML =
    '<section><div class="card">'+
      stageBlock('Foundation', 'var(--text)', foundation, true)+
      stageBlock('Paired', 'var(--indigo)', paired, false)+
      stageBlock('Spiced pair', 'var(--spice)', spiced, false)+
      stageBlock('Combined dish', 'var(--emerald)', combined, false)+
      dessertBlock+
    '</div></section>';
}

// ==================== Tab switching ====================
const tabNav = document.getElementById('tabNav');
const renderers = { overview: renderOverview, byfood: renderByFood, allergens: renderAllergens, progression: renderProgression };
let currentTab = 'overview';

tabNav.addEventListener('click', e=>{
  const btn = e.target.closest('.tab-btn');
  if(!btn) return;
  const tab = btn.dataset.tab;
  if(tab===currentTab) return;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const oldPanel = document.getElementById('panel-'+currentTab);
  oldPanel.classList.remove('in');
  oldPanel.classList.add('pre-in');
  setTimeout(()=>{ oldPanel.classList.remove('pre-in'); oldPanel.style.display='none'; }, 280);
  currentTab = tab;
  const panel = document.getElementById('panel-'+tab);
  panel.style.display='block';
  panel.classList.add('pre-in');
  const stats = computeStats();
  renderers[tab](stats);
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{ panel.classList.remove('pre-in'); panel.classList.add('in'); });
  });
});

function renderAll(){
  const stats = computeStats();
  const panel = document.getElementById('panel-'+currentTab);
  panel.style.display='block';
  panel.classList.add('in');
  renderers[currentTab](stats);
}

onAuthStateChanged(auth, user=>{
  if(!user) return;
  onSnapshot(mealsCol, snap=>{
    entries = snap.docs.map(d=>({id:d.id, ...d.data()}));
    statusEl.textContent = 'live'; statusEl.className = 'sync-status live';
    renderAll();
  }, err=>{ statusEl.textContent='sync error'; statusEl.className='sync-status err'; console.error(err); });
});
signInAnonymously(auth).catch(err=>{ statusEl.textContent='sync error'; statusEl.className='sync-status err'; console.error(err); });
renderAll();
</script>
