<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riyaan's Weaning Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#FF6B57; --coral-dark:#E5503C;
  --indigo:#6C63FF; --indigo-dark:#5148E0;
  --amber:#F5A623; --amber-dark:#C6820D;
  --teal:#17A6A6; --teal-dark:#0E7F7F;
  --emerald:#1DA55E; --emerald-dark:#158048;
  --root:#C96A2E; --leafy:#3FAE6A; --garden:#D6336C; --legume:#C99A2E; --spice:#8E4CC1; --allergenc:#2E9CD6;
  --bg:#FAFAF8; --card:#FFFFFF; --border:#ECEAE3;
  --text:#20232B; --text-muted:#767B87;
  --burgundy:#D6336C; --burgundy-light:#FBE1E9;
  --shadow-sm:0 1px 3px rgba(32,35,43,0.06); --shadow-md:0 4px 16px rgba(32,35,43,0.09);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:14px;}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 90px;}
.header-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
h1{font-family:'Baloo 2',sans-serif;font-size:23px;font-weight:800;color:var(--text);}
.nav-link{font-size:12.5px;color:var(--indigo);text-decoration:none;font-weight:700;}
.sync-status{font-size:9px;font-weight:800;padding:3px 9px;border-radius:20px;background:var(--border);color:var(--text-muted);}
.sync-status.live{background:var(--emerald);color:#fff;}
.sync-status.err{background:var(--burgundy);color:#fff;}

section{margin-bottom:22px;}
.section-label{font-family:'Baloo 2',sans-serif;font-size:14px;font-weight:700;color:var(--text-muted);margin-bottom:9px;padding-left:2px;}

/* Bold full-bleed hero cards */
.hero-card{border-radius:24px;padding:22px;color:#fff;box-shadow:var(--shadow-md);}
.hero-card.c-coral{background:var(--coral);}
.hero-card.c-indigo{background:var(--indigo);}
.hero-card.c-amber{background:var(--amber);}
.hero-card.c-teal{background:var(--teal);}
.week-plan-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.22);}
.week-plan-row:last-child{border-bottom:none;}
.wp-day{width:74px;font-size:11.5px;font-weight:700;color:#fff;flex-shrink:0;}
.wp-meals{display:flex;flex-direction:column;gap:6px;flex:1;}
.wp-badges{display:flex;gap:6px;flex-wrap:wrap;}
.hero-card .hc-tag{font-size:11px;font-weight:800;background:rgba(255,255,255,0.28);display:inline-block;padding:3px 11px;border-radius:20px;margin-bottom:12px;}
.mono-row{display:flex;gap:6px;margin-bottom:10px;cursor:pointer;}
.hero-card .hc-items{font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:700;margin-bottom:6px;cursor:pointer;line-height:1.3;}
.hero-card .hc-meta{font-size:12.5px;opacity:0.92;margin-bottom:16px;}
.badge-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}

.btn-hero{display:block;width:100%;background:#fff;color:var(--coral);border:none;border-radius:16px;padding:15px;font-size:16px;font-weight:800;font-family:'Baloo 2',sans-serif;cursor:pointer;min-height:52px;}
.pill-secondary{display:block;width:100%;background:var(--card);color:var(--text);border:2px solid var(--border);border-radius:30px;padding:13px;font-size:13.5px;font-weight:700;cursor:pointer;min-height:48px;margin-top:10px;}
.pill-secondary:active{background:var(--border);}

.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:2px;}
.stat-pill{background:rgba(255,255,255,0.18);border-radius:14px;padding:11px 14px;}
.stat-pill .num{font-family:'Baloo 2',sans-serif;font-size:clamp(18px,5vw,23px);font-weight:800;color:#fff;white-space:nowrap;}
.stat-pill .lbl{font-size:10.5px;color:#fff;opacity:0.85;}
.allergen-list{margin-top:12px;font-size:12.5px;}
.allergen-list .row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.22);}
.allergen-list .row:last-child{border-bottom:none;}
.allergen-list .aname{flex:1;font-weight:700;color:#fff;}
.status-pill{font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,0.25);color:#fff;}
.status-pill.alert{background:#fff;color:var(--burgundy);}

/* Shopping list */
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px;}
.shop-item{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.22);border-radius:12px;padding:7px 10px;}
.shop-item .label{font-size:12px;font-weight:700;color:#fff;}

/* History — clean white cards, colour comes from badges */
.hist-entry{background:var(--card);border-radius:16px;padding:12px 14px;border:1px solid var(--border);margin-bottom:8px;box-shadow:var(--shadow-sm);}
.hist-entry .top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.hist-entry .badges{display:flex;gap:6px;flex-wrap:wrap;flex:1;}
.hist-entry .date{color:var(--text-muted);font-size:11px;white-space:nowrap;}
.hist-entry .tags{margin-top:7px;font-size:11.5px;color:var(--text-muted);}
.hist-entry .actions{margin-top:8px;display:flex;gap:6px;}
.hist-entry .actions button{font-size:12px;padding:8px 13px;min-height:36px;border-radius:20px;border:none;font-weight:700;cursor:pointer;}
.hist-entry .actions .edit-btn{background:var(--border);color:var(--text);}
.hist-entry .actions .del-btn{background:var(--burgundy-light);color:var(--burgundy);}
.empty{color:var(--text-muted);font-size:13px;font-style:italic;}

/* Badge icon (food/spice/allergen) */
.food-badge{border-radius:50%;flex-shrink:0;display:inline-flex;}
.badge-with-label{display:inline-flex;align-items:center;gap:7px;}

/* Chips with badges (used in sheet) */
.chip-grid{display:flex;flex-wrap:wrap;gap:8px;}
.chip{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--border);background:var(--card);border-radius:24px;padding:7px 14px 7px 7px;font-size:13px;font-weight:700;cursor:pointer;min-height:44px;color:var(--text);}
.chip.selected{border-color:var(--indigo);background:#EEEDFF;}
.chip-group-label{font-size:11px;font-weight:800;color:var(--text-muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:0.04em;}
.chip-group-label:first-child{margin-top:0;}

/* Sheet */
.fab{display:none;}
.sheet-backdrop{position:fixed;inset:0;background:rgba(32,35,43,0.45);z-index:390;display:none;}
.sheet-backdrop.open{display:block;}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;background:var(--card);border-radius:26px 26px 0 0;z-index:395;transform:translateY(110%);transition:transform 0.32s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(32,35,43,0.2);}
.sheet.open{transform:translateY(0);}
.sheet-handle{width:38px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 2px;}
.sheet-header{padding:8px 20px 4px;}
.sheet-header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.sheet-step-label{font-size:11.5px;font-weight:800;color:var(--indigo);}
.sheet-close{background:none;border:none;font-size:22px;color:var(--text-muted);cursor:pointer;line-height:1;padding:4px 6px;}
.sheet-progress{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.sheet-progress-fill{height:100%;background:var(--indigo);border-radius:3px;transition:width 0.25s ease;}
.sheet-body{padding:14px 20px 18px;overflow-y:auto;flex:1;}
.sheet-step-title{font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:700;margin-bottom:14px;}
.sheet-footer{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--border);}
.sheet-footer button{flex:1;border:none;border-radius:16px;padding:14px;font-size:15px;font-weight:800;font-family:'Baloo 2',sans-serif;cursor:pointer;min-height:50px;}
.sheet-footer .btn-back{background:var(--border);color:var(--text);flex:0 0 90px;}
.sheet-footer .btn-next{background:var(--indigo);color:#fff;}
.sheet-footer .btn-submit{background:var(--emerald);color:#fff;}

label{font-size:11.5px;font-weight:800;color:var(--text-muted);display:block;margin-bottom:7px;text-transform:uppercase;letter-spacing:0.03em;}
input,select,textarea{width:100%;font-size:16px;font-family:inherit;padding:11px 12px;border:2px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);}
textarea{resize:vertical;min-height:60px;}
.quick-chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.quick-chip{border:2px solid var(--border);background:var(--card);border-radius:20px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;}

/* Format cards */
.format-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.format-card{border:2px solid var(--border);background:var(--card);border-radius:14px;padding:14px;cursor:pointer;text-align:left;}
.format-card.selected{border-color:var(--indigo);background:#EEEDFF;}
.format-card .fc-icon{color:var(--indigo);margin-bottom:8px;}
.format-card .fc-title{font-weight:800;font-size:13.5px;margin-bottom:2px;}
.format-card .fc-desc{font-size:11.5px;color:var(--text-muted);line-height:1.35;}

/* Reaction cards */
.reaction-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.reaction-card{border:2px solid var(--border);background:var(--card);border-radius:14px;padding:16px 8px;cursor:pointer;text-align:center;}
.reaction-card .rc-icon{font-size:26px;margin-bottom:4px;}
.reaction-card .rc-label{font-size:12.5px;font-weight:800;}
.reaction-card.selected.r-liked{border-color:var(--emerald);background:#E4F7EC;}
.reaction-card.selected.r-neutral{border-color:var(--text-muted);background:var(--border);}
.reaction-card.selected.r-refused{border-color:var(--burgundy);background:var(--burgundy-light);}

.checkbox-row{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;}
.checkbox-row input{width:20px;height:20px;min-height:auto;}
.sub-fields{padding:12px;background:var(--bg);border-radius:12px;margin-top:10px;display:none;}
.sub-fields.open{display:block;}

.summary-strip{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px;padding:12px;background:var(--bg);border-radius:12px;}

/* Recipe panel */
.recipe-panel{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:20px 20px 0 0;padding:20px;max-height:65vh;overflow-y:auto;z-index:400;display:none;box-shadow:0 -8px 30px rgba(32,35,43,0.2);}
.recipe-panel.open{display:block;}
.recipe-panel h3{font-family:'Baloo 2',sans-serif;font-size:19px;color:var(--text);margin-bottom:12px;}
.recipe-panel .close-btn{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);}
.recipe-panel p{font-size:13.5px;margin-bottom:8px;}

@media(max-width:600px){.format-grid{grid-template-columns:1fr 1fr;}.shop-grid{grid-template-columns:1fr;}}
</style>
</head>

</div>

</section>

  <div class="section-label" style="color:var(--teal-dark);">History</div>
  <div id="historyList"></div>
</section>

</div>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-header-top">
      <span class="sheet-step-label" id="sheetStepLabel"></span>
      <button class="sheet-close" id="sheetCloseBtn" aria-label="Close">&times;</button>
    </div>
    <div class="sheet-progress"><div class="sheet-progress-fill" id="sheetProgressFill"></div></div>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-footer" id="sheetFooter"></div>
</div>

<div class="recipe-panel" id="recipePanel">
  <button class="close-btn" onclick="closeRecipe()">&times;</button>
  <div id="recipeContent"></div>
</div>

function closeRecipe(){ document.getElementById('recipePanel').classList.remove('open'); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>

const INGREDIENT_TO_FOOD_NAME = { "Plain yoghurt": "Yoghurt", "Grated cheese": "Cheese" };
function joinNaturally(items){
  if(items.length===1) return items[0];
  if(items.length===2) return items[0]+' and '+items[1];
  return items.slice(0,-1).join(', ')+' and '+items[items.length-1];
}
// Builds one plain-English title covering every stage — a single "Broccoli", a pair
// "Carrot and Potato", a named combined dish, any allergen stirred in, and any dessert —
// so the same function produces a correct sentence whether there's one ingredient or four.
// allergenAlreadyInDish suppresses the extra phrase when the allergen's vehicle is already
// one of the meal's own ingredients (e.g. Spaghetti covering Wheat), so the sentence never
// implies bolting on a second, unrelated food.
function buildMealSentence({items, mealName, spice, allergenIngredient, allergenAlreadyInDish, dessertItems, dessertName}){
  let main = mealName || joinNaturally(items);
  const extras = [];
  if(spice) extras.push('a pinch of '+spice.toLowerCase());
  if(allergenIngredient && !allergenAlreadyInDish){
    extras.push(INGREDIENT_PHRASES[allergenIngredient] || ('a little '+allergenIngredient.toLowerCase()));
  }
  if(extras.length) main += ' with '+extras.join(' and ');
  if(dessertItems && dessertItems.length){
    main += ' and '+(dessertName || joinNaturally(dessertItems))+' for dessert';
  }
  return main;
}

// ---------------- State ----------------
let entries = [];
let editingId = null;
let selectedItems = [];
let selectedReaction = null;
let selectedAllergens = [];
let selectedAllergenReaction = null;

// ---------------- Derived stats (unchanged logic) ----------------
function computeStats(){
  const allTrackable = [...FOODS, ...FRUITS];
  const foodExposures = {}; allTrackable.forEach(f=>foodExposures[f.name]=[]);
  const pairs = {};
  const allergenLogExplicit = {}; ALLERGENS.forEach(a=>allergenLogExplicit[a.name]=[]);

  const sorted = [...entries].sort((a,b)=> new Date(a.ts) - new Date(b.ts));
  sorted.forEach(e=>{
    (e.items||[]).forEach(it=>{ if(foodExposures[it]) foodExposures[it].push({ts:e.ts, reaction:e.reaction}); });
    if(e.items && e.items.length===2){
      const key = [...e.items].sort().join(' + ');
      if(!pairs[key]) pairs[key] = {count:0, spicedCount:0, combinedCount:0, lastPlain:null, lastSpiced:null, lastCombined:null};
      const p = pairs[key];
      if(e.format==='combined'){ p.combinedCount++; p.lastCombined=e.reaction; }
      else if(e.spices && e.spices.length){ p.spicedCount++; p.lastSpiced=e.reaction; }
      else { p.count++; p.lastPlain=e.reaction; }
    }
    if(e.allergenUsed && e.allergens){
      e.allergens.forEach(a=>{ if(allergenLogExplicit[a]) allergenLogExplicit[a].push({ts:e.ts, reaction:e.allergenReaction}); });
    }
  });

  const dayMs = 86400000;
  const now = new Date();
  const acceptance = {};
  allTrackable.forEach(f=>{
    const exp = foodExposures[f.name];
    const last2 = exp.slice(-2).map(x=>x.reaction);
    acceptance[f.name] = exp.length>=3 && !last2.includes('Refused');
  });

  // Pass 1: allergen STATE only ever advances from explicit, deliberately-flagged
  // exposures — this preserves the watched day-1/day-2 introduction safety behaviour.
  // Pass 2: once an allergen is safely introduced, any food already known to contain it
  // (e.g. toast for Wheat, via each food's allergenLink) also refreshes its "last given"
  // date — so eating bread keeps Wheat's maintenance schedule accurate without needing
  // the allergen box ticked every single time. This never advances state on its own.
  const allergenStatus = {};
  ALLERGENS.forEach(a=>{
    const log = allergenLogExplicit[a.name];
    const hadReaction = log.some(x=>x.reaction==='reaction');
    let state = 'not-started';
    if(hadReaction) state = 'reaction';
    else if(log.length>=2) state = 'introduced';
    else if(log.length===1) state = 'awaiting-repeat';

    let lastGiven = log.length ? new Date(log[log.length-1].ts) : null;
    if(state==='introduced'){
      const linkedFoods = FOODS.filter(f=>f.allergenLink===a.name).map(f=>f.name);
      if(linkedFoods.length){
        sorted.forEach(e=>{
          if((e.items||[]).some(it=>linkedFoods.includes(it))){
            const d = new Date(e.ts);
            if(!lastGiven || d>lastGiven) lastGiven = d;
          }
        });
      }
    }
    const daysSince = lastGiven ? Math.floor((now-lastGiven)/dayMs) : null;
    allergenStatus[a.name] = {state, lastGiven, daysSince, count:log.length};
  });

  // The main-course pool stays scoped to FOODS only — fruit is deliberately kept out of
  // the Foundation/Paired/Spiced/Combined pairing logic and handled as a separate "dessert"
  // suggestion instead, so a fruit never gets algorithmically paired with a vegetable as if
  // it were an equal main-course partner.
  const unlockedFoods = FOODS.map(f=>f.name);

  // Fruit unlocks once ~80% of everything else is accepted — a proxy for "happy with his veg."
  // This threshold is a judgement call, not a researched figure — easy to loosen or tighten.
  const acceptedCoreCount = FOODS.filter(f=>acceptance[f.name]).length;
  const fruitsUnlocked = FOODS.length>0 && (acceptedCoreCount/FOODS.length) >= 0.8;

  return {foodExposures, pairs, allergenStatus, acceptance, unlockedFoods, fruitsUnlocked};
}

function suggestDessert(stats){
  if(!stats.fruitsUnlocked) return null;
  for(const combo of DESSERT_COMBOS){
    if(stats.acceptance[combo.foods[0]] && stats.acceptance[combo.foods[1]]){
      return {items:[...combo.foods], name:combo.name, spice:combo.spice||null};
    }
  }
  const names = FRUITS.map(f=>f.name);
  names.sort((a,b)=> stats.foodExposures[a].length - stats.foodExposures[b].length);
  return {items:[names[0]], name:null, spice:null};
}

function suggestAllergenAction(stats){
  const order = ALLERGENS.map(a=>a.name);
  for(const name of order){
    if(stats.allergenStatus[name].state==='awaiting-repeat') return {type:'repeat', name};
  }
  const due = order.find(name=>{
    const s = stats.allergenStatus[name];
    return s.state==='introduced' && s.daysSince!==null && s.daysSince>=3;
  });
  if(due) return {type:'maintenance', name:due};
  const lastIntroDate = order.map(n=>stats.allergenStatus[n]).filter(s=>s.count>0).map(s=>s.lastGiven).sort((a,b)=>b-a)[0];
  const daysSinceLastIntro = lastIntroDate ? Math.floor((new Date()-lastIntroDate)/86400000) : 99;
  if(daysSinceLastIntro>=2){
    const next = order.find(name=>stats.allergenStatus[name].state==='not-started');
    if(next) return {type:'new', name:next};
  }
  return null;
}

function suggestNextMeal(stats){
  const allergenAction = suggestAllergenAction(stats);

  // Picks a sensible allergen vehicle for the SPECIFIC dish being suggested, rather than
  // one fixed ingredient regardless of context — yoghurt suits a plain veg mash, but not
  // a tomato pasta sauce, where cheese is what actually belongs. If the dish already
  // contains a food linked to this allergen (e.g. Spaghetti for Wheat), that food IS the
  // vehicle — no need to bolt on an unrelated stir-in as well.
  function pickAllergenVehicle(allergenName, currentItems){
    const inDish = currentItems.find(it => foodByName[it] && foodByName[it].allergenLink === allergenName);
    if(inDish) return {ingredient: inDish, alreadyInDish: true};
    if(allergenName === 'Dairy'){
      const hasCarb = currentItems.some(it => foodByName[it] && foodByName[it].group === 'carb');
      return {ingredient: hasCarb ? 'Grated cheese' : 'Plain yoghurt', alreadyInDish: false};
    }
    const fallback = ALLERGENS.find(a=>a.name===allergenName);
    return {ingredient: fallback ? fallback.ingredient : allergenName, alreadyInDish: false};
  }

  const withAllergen = obj => {
    if(!allergenAction) return {...obj, allergenTag: null, allergenIngredient: null, allergenAlreadyInDish: false};
    const vehicle = pickAllergenVehicle(allergenAction.name, obj.items || []);
    const base = allergenAction.type==='repeat' ? 'Repeat allergen (day 2): ' :
                 allergenAction.type==='new' ? 'New allergen to introduce: ' :
                 'Allergen maintenance due: ';
    const tag = base + allergenAction.name + (vehicle.alreadyInDish ? ' — already in this meal via '+vehicle.ingredient : '');
    return {...obj, allergenTag: tag, allergenIngredient: vehicle.ingredient, allergenAlreadyInDish: vehicle.alreadyInDish};
  };

  for(const key in stats.pairs){
    const p = stats.pairs[key];
    const items = key.split(' + ');
    if(p.spicedCount>=3 && p.lastSpiced!=='Refused' && p.combinedCount===0){
      const meal = findTargetMealByCoreKey(key);
      if(meal && meal.foods.every(f=>stats.acceptance[f])){
        return withAllergen({stage:'Combined dish', items:[...meal.foods], format:'combined', spiceSuggested:true, mealName:meal.name, suggestedSpice:meal.spice});
      }
      return withAllergen({stage:'Combined dish', items, format:'combined', spiceSuggested:true});
    }
    if(p.count>=3 && p.lastPlain!=='Refused' && p.spicedCount===0){
      const meal = findTargetMealByCoreKey(key);
      return withAllergen({stage:'Spiced pair', items, format:'both', spiceSuggested:true, suggestedSpice: meal ? meal.spice : undefined, mealName: meal ? meal.name : undefined});
    }
  }

  function findInProgress(){
    for(const key in stats.pairs){
      const p = stats.pairs[key];
      const items = key.split(' + ');
      if(p.spicedCount>=1 && p.combinedCount===0 && !(p.spicedCount>=3 && p.lastSpiced!=='Refused')){
        const meal = findTargetMealByCoreKey(key);
        return {stage:'Spiced pair', items, format:'both', spiceSuggested:true, suggestedSpice: meal ? meal.spice : undefined, mealName: meal ? meal.name : undefined};
      }
    }
    for(const key in stats.pairs){
      const p = stats.pairs[key];
      const items = key.split(' + ');
      if(p.count>=1 && p.spicedCount===0 && !(p.count>=3 && p.lastPlain!=='Refused')){
        const meal = findTargetMealByCoreKey(key);
        return {stage:'Paired', items, format:'both', spiceSuggested:false, mealName: meal ? meal.name : undefined};
      }
    }
    return null;
  }

  const candidates = stats.unlockedFoods.filter(f=>!stats.acceptance[f]);
  const inProgress = findInProgress();

  if(candidates.length>0){
    const alternateToFoundation = (entries.length % 2 === 0) || !inProgress;
    if(alternateToFoundation){
      candidates.sort((a,b)=> stats.foodExposures[a].length - stats.foodExposures[b].length);
      return withAllergen({stage:'Foundation', items:[candidates[0]], format:'both', spiceSuggested:false});
    }
  }
  if(inProgress) return withAllergen(inProgress);

  const accepted = stats.unlockedFoods.filter(f=>stats.acceptance[f]);
  const pairCountFor = f => Object.keys(stats.pairs).filter(k=>k.split(' + ').includes(f)).length;
  const isAddin = f => (foodByName[f] && foodByName[f].role==='addin');

  // Prefer starting a pair that's the core of a real target dish, when both its foods
  // are already accepted — this is what actually builds toward named meals rather than
  // arbitrary fewest-exposure combinations.
  for(const meal of TARGET_MEALS){
    const [a,b] = meal.foods.slice(0,2);
    if(stats.acceptance[a] && stats.acceptance[b]){
      const key = [a,b].sort().join(' + ');
      if(!stats.pairs[key]){
        return withAllergen({stage:'Paired', items:[a,b], format:'both', spiceSuggested:false, mealName:meal.name});
      }
    }
  }

  const byFewestPairs = [...accepted].sort((a,b)=> pairCountFor(a)-pairCountFor(b));
  for(let i=0;i<byFewestPairs.length;i++){
    for(let j=i+1;j<byFewestPairs.length;j++){
      // Skip pairing two "stir-in" items together (e.g. chia + flaxseed) — neither is a
      // meal on its own, so that combo doesn't read as a sensible dish. At least one side
      // of any new pairing should be a genuine base food.
      if(isAddin(byFewestPairs[i]) && isAddin(byFewestPairs[j])) continue;
      const key = [byFewestPairs[i],byFewestPairs[j]].sort().join(' + ');
      if(!stats.pairs[key]){
        return withAllergen({stage:'Paired', items:[byFewestPairs[i],byFewestPairs[j]], format:'both', spiceSuggested:false});
      }
    }
  }
  if(candidates.length){
    candidates.sort((a,b)=> stats.foodExposures[a].length - stats.foodExposures[b].length);
    return withAllergen({stage:'Foundation', items:[candidates[0]], format:'both', spiceSuggested:false});
  }
  return withAllergen({stage:'All caught up', items:[], format:null, spiceSuggested:false});
}

// Looks at real logged meals over the last 7 days to infer your current pace —
// 1, 2 or 3 meals/day — rather than assuming a fixed number. As you genuinely
// ramp from one meal a day to two or three, this notices and the projection
// ramps with you, automatically, next time it's computed.
function computeRecentMealsPerDay(){
  if(!entries.length) return 1;
  const now = new Date();
  const sevenDaysAgo = new Date(now.getTime() - 7*86400000);
  const recent = entries.filter(e => new Date(e.ts) >= sevenDaysAgo);
  if(!recent.length) return 1;
  const dayKeys = new Set(recent.map(e => new Date(e.ts).toDateString()));
  const avgPerDay = recent.length / Math.max(dayKeys.size, 1);
  return Math.max(1, Math.min(3, Math.round(avgPerDay)));
}

function projectWeekPlan(stats){
  const clone = {foodExposures:Object.fromEntries(Object.entries(stats.foodExposures).map(([k,v])=>[k,v.length])), pairs:JSON.parse(JSON.stringify(stats.pairs)), acceptance:{...stats.acceptance}, unlockedFoods:[...stats.unlockedFoods]};
  const mealsPerDay = computeRecentMealsPerDay();
  const days = [];
  const today = new Date();
  outer:
  for(let i=0;i<7;i++){
    const date = new Date(today.getTime() + i*86400000);
    const meals = [];
    for(let m=0;m<mealsPerDay;m++){
      const fakeStats = {
        foodExposures: Object.fromEntries(Object.entries(clone.foodExposures).map(([k,v])=>[k,Array(v)])),
        pairs: clone.pairs, acceptance: clone.acceptance, unlockedFoods: clone.unlockedFoods,
        allergenStatus: stats.allergenStatus, fruitsUnlocked: stats.fruitsUnlocked
      };
      const s = suggestNextMeal(fakeStats);
      const d = suggestDessert(fakeStats);
      meals.push({main:s, dessert:d});
      s.items.forEach(it=>{ clone.foodExposures[it] = (clone.foodExposures[it]||0)+1; });
      if(d) d.items.forEach(it=>{ clone.foodExposures[it] = (clone.foodExposures[it]||0)+1; });
      if(s.items.length===0 && !d && m===0 && days.length===0) break outer;
    }
    days.push({date, meals, mealsPerDay});
  }
  return days;
}

// Shopping is deliberately derived from the SAME 7-day plan shown in Week Ahead,
// rather than its own separate simulation — the two can never drift apart.
function projectShoppingList(stats){
  const plan = projectWeekPlan(stats);
  const needed = new Set();
  plan.forEach(day=>{
    day.meals.forEach(meal=>{
      meal.main.items.forEach(it=>needed.add(it));
      if(meal.main.allergenIngredient) needed.add(meal.main.allergenIngredient);
      if(meal.dessert) meal.dessert.items.forEach(it=>needed.add(it));
    });
  });
  return [...needed];
}

function renderHistory(){
  const el = document.getElementById('historyList');
  if(!entries.length){ el.innerHTML = '<span class="empty">No meals logged yet.</span>'; return; }
  const sorted = [...entries].sort((a,b)=> new Date(b.ts)-new Date(a.ts));
  el.innerHTML = sorted.map(e=>{
    const d = new Date(e.ts);
    const dateStr = d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + ' ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    const tags = [e.mealSlot||null, e.format, e.reaction, (e.spices&&e.spices.length)?('spice: '+e.spices.join(', ')):null, e.allergenUsed?('allergen: '+(e.allergens||[]).join(', ')):null].filter(Boolean).join(' · ');

    return '<div class="hist-entry" data-id="'+e.id+'">'+
      '<div class="top"><div class="badges">'+badges+'</div><span class="date">'+dateStr+'</span></div>'+

      const allergenObjs = (entry.allergenUsed && entry.allergens || []).map(n=>ALLERGENS.find(a=>a.name===n)).filter(Boolean);
      openRecipe(entry.items||[], { format: entry.format, spiceNames: entry.spices||[], allergens: allergenObjs });
    };
  });
}

function openRecipe(items, context){
  context = context || {};
  const format = context.format || 'both';
  const foods = items.map(n=>foodByName[n]).filter(Boolean);
  if(!foods.length) return;
  let body = '<div class="badge-row">'+foods.map(f=>badgeWithLabel(f.name,30)).join('')+'</div>';
  foods.forEach(f=>{
    body += '<p><b>'+escapeHtml(f.name)+':</b> ';
    if(format==='finger'){ body += escapeHtml(f.finger); }
    else if(format==='soft' || format==='combined'){ body += escapeHtml(f.soft); }
    else { body += 'Soft — '+escapeHtml(f.soft)+'. Finger — '+escapeHtml(f.finger); }
    body += '</p>';
  });
  if(format==='combined' && foods.length>1){
    body += '<p><b>To combine:</b> Prepare each ingredient using its soft method above, then mash or stir together into one dish.</p>';
  }
  if(context.spiceNames && context.spiceNames.length){
    body += '<p><b>Spice:</b> stir in a small pinch of '+escapeHtml(context.spiceNames.join(', '))+', ground, no salt.</p>';
  } else if(context.suggestedSpice){
    body += '<p><b>Spice:</b> try '+escapeHtml(context.suggestedSpice)+' — a small pinch, ground, no salt.</p>';
  } else if(context.spiceSuggested){
    body += '<p><b>Spice:</b> a mild spice is suggested this time — pick one in the log flow.</p>';
  }
  (context.allergens||[]).forEach(a=>{
    body += '<p><b>Allergen — '+escapeHtml(a.name)+':</b> stir in '+escapeHtml(a.ingredient)+' to combine.</p>';
  });
  if(context.allergenNoteIfInDish){
    body += '<p><b>Allergen:</b> '+escapeHtml(context.allergenNoteIfInDish)+'</p>';
  }
  if(context.dessertItems && context.dessertItems.length){
    const dessertFoods = context.dessertItems.map(n=>foodByName[n]).filter(Boolean);
    body += '<p><b>Dessert'+(context.dessertName?' — '+escapeHtml(context.dessertName):'')+':</b> '+dessertFoods.map(f=>escapeHtml(f.name)+' ('+escapeHtml(f.soft)+')').join('; ')+'</p>';
  }
  const spiceForTitle = context.suggestedSpice || (context.spiceNames && context.spiceNames.length ? context.spiceNames.join(' and ').toLowerCase() : null);
  const allergenIngredientForTitle = context.allergenIngredient || ((context.allergens && context.allergens[0]) ? context.allergens[0].ingredient : null);
  const title = buildMealSentence({
    items, mealName: context.mealName, spice: spiceForTitle,
    allergenIngredient: allergenIngredientForTitle, allergenAlreadyInDish: !!context.allergenAlreadyInDish,
    dessertItems: context.dessertItems, dessertName: context.dessertName
  });
  document.getElementById('recipeContent').innerHTML = '<h3>'+escapeHtml(title)+'</h3>' + body;
  document.getElementById('recipePanel').classList.add('open');
}
window.closeRecipe = closeRecipe;

  renderShopping(stats);
  renderHistory();
}

let sheetStep = 1;
let sheetHasDessert = false;
let sheetTotalSteps = 6;
let selectedFormat = 'soft';
let selectedTs = '';
let selectedMealSlot = null;
let allergenUsedFlag = false;
let notesValue = '';
let sheetIsCustomLog = false;
let selectedMainPick = null;
let selectedDessertPick = null;
let selectedSnackPick = null;
const ITEM_CAP = 6; // raised from 4 so a full named dish (up to 4) plus a dessert combo (2) fit without silently truncating

function nowLocalIso(){ return new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16); }

function getStepLabel(n){
  const labels = ["Meal & time","Main veg","Legume, grain or dairy","Spice","Allergen"];
  if(sheetHasDessert) labels.push("Dessert");
  labels.push("Review & save");
  return labels[n-1];
}
function isDessertStep(n){ return sheetHasDessert && n===6; }
function isReviewStep(n){ return n===sheetTotalSteps; }

// The three quick-pick slots (Main/Dessert/Snack) are independent and additive — this
// rebuilds items/format/spices/notes from whichever of the three are currently selected,
// rather than incrementally patching, so toggling any one slot can never leave stray
// leftover items from a previously-selected pick in that same slot.
function recomputeFromPicks(){
  const picks = [selectedMainPick, selectedDessertPick, selectedSnackPick]
    .filter(Boolean).map(name => ALL_MEAL_PICKS.find(m=>m.name===name)).filter(Boolean);
  const items = [];
  picks.forEach(p => p.items.forEach(it => { if(!items.includes(it) && items.length<ITEM_CAP) items.push(it); }));
  selectedItems = items;
  if(picks.length>1) selectedFormat = picks.some(p=>p.format==='combined') ? 'combined' : 'both';
  else if(picks.length===1) selectedFormat = picks[0].format;
  else selectedFormat = 'soft';
  const spices = [];
  picks.forEach(p => p.spices.forEach(sp => { if(!spices.includes(sp)) spices.push(sp); }));
  selectedSpices = spices;
  notesValue = picks.map(p=>p.notes).filter(Boolean).join(' ');
}

function resetSheetState(prefill){
  editingId = (prefill && prefill.editingId) || null;
  selectedItems = (prefill && prefill.items) ? [...prefill.items] : [];
  if(sheetHasDessert && prefill && prefill.dessertPrefill && prefill.dessertPrefill.length){
    prefill.dessertPrefill.forEach(it=>{
      if(!selectedItems.includes(it) && selectedItems.length<ITEM_CAP) selectedItems.push(it);
    });
  }
  selectedMealSlot = (prefill && prefill.mealSlot) || null;
  selectedFormat = (prefill && prefill.format) || 'soft';
  selectedReaction = (prefill && prefill.reaction) || null;
  selectedSpices = (prefill && Array.isArray(prefill.spices)) ? [...prefill.spices] : [];
  allergenUsedFlag = !!(prefill && prefill.allergenUsed);
  selectedAllergens = (prefill && prefill.allergens) ? [...prefill.allergens] : [];
  selectedAllergenReaction = (prefill && prefill.allergenReaction) || null;
  selectedTs = (prefill && prefill.ts) ? new Date(new Date(prefill.ts) - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : nowLocalIso();
  notesValue = (prefill && prefill.notes) || '';
  sheetIsCustomLog = !prefill;
  selectedMainPick = null; selectedDessertPick = null; selectedSnackPick = null;
}

function openSheet(prefill){
  const stats = computeStats();
  sheetHasDessert = stats.fruitsUnlocked;
  sheetTotalSteps = sheetHasDessert ? 7 : 6;
  resetSheetState(prefill);
  sheetStep = 1;
  document.getElementById('sheetBackdrop').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  renderSheetStep();
}
function closeSheet(){
  document.getElementById('sheetBackdrop').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}
document.getElementById('sheetCloseBtn').onclick = closeSheet;
document.getElementById('sheetBackdrop').onclick = closeSheet;
document.getElementById('logOwnBtn').onclick = ()=> openSheet(null);

function chipListHtml(names, selectedArr, dataAttr){

  ).join('');
}

function renderSheetStep(){
  document.getElementById('sheetStepLabel').textContent = 'Step '+sheetStep+' of '+sheetTotalSteps+' · '+getStepLabel(sheetStep);
  document.getElementById('sheetProgressFill').style.width = (sheetStep/sheetTotalSteps*100)+'%';
  const body = document.getElementById('sheetBody');
  const footer = document.getElementById('sheetFooter');

  if(sheetStep===1){
    let templateBlock = '';
    if(sheetIsCustomLog){
      const mains = ALL_MEAL_PICKS.filter(m=>m.category==='main');
      const desserts = ALL_MEAL_PICKS.filter(m=>m.category==='dessert');
      const snacks = ALL_MEAL_PICKS.filter(m=>m.category==='snack');
      const pickChip = (m, current) => '<button type="button" class="chip'+(current===m.name?' selected':'')+'" data-tpl="'+escapeHtml(m.name)+'"><span>'+escapeHtml(m.name)+'</span></button>';

        '<input type="text" id="templateFilter" placeholder="Search…" style="margin-bottom:10px;">'+

          '<div class="chip-group-label">Main (pick one, optional)</div><div class="chip-grid" data-slot="main">'+mains.map(m=>pickChip(m,selectedMainPick)).join('')+'</div>'+
          '<div class="chip-group-label">Dessert (pick one, optional)</div><div class="chip-grid" data-slot="dessert">'+desserts.map(m=>pickChip(m,selectedDessertPick)).join('')+'</div>'+
          '<div class="chip-group-label">Snack (pick one, optional)</div><div class="chip-grid" data-slot="snack">'+snacks.map(m=>pickChip(m,selectedSnackPick)).join('')+'</div>'+
        '</div>'+
        '<p style="font-size:11.5px;color:var(--text-muted);margin:6px 0 16px;">Tap again to remove a pick. Everything stays editable in the steps ahead.</p>';
    }
    body.innerHTML =
      '<div class="sheet-step-title">Which meal, and when?</div>'+
      templateBlock+
      '<label>Meal</label>'+
      '<div class="chip-grid" id="mealSlotChips">'+MEAL_SLOTS.map(m=>'<button type="button" class="chip'+(selectedMealSlot===m?' selected':'')+'" data-slot="'+m+'"><span>'+m+'</span></button>').join('')+'</div>'+
      '<label style="margin-top:16px;">Date &amp; time</label>'+
      '<input type="datetime-local" id="sheetTsInput" value="'+selectedTs+'">'+
      '<div class="quick-chips">'+
        '<button type="button" class="quick-chip" id="qcNow">Just now</button>'+
      '</div>';
    document.getElementById('sheetTsInput').oninput = e=>{ selectedTs = e.target.value; };
    document.getElementById('qcNow').onclick = ()=>{ selectedTs = nowLocalIso(); renderSheetStep(); };
    body.querySelectorAll('#mealSlotChips .chip').forEach(c=>{
      c.onclick = ()=>{ selectedMealSlot = (selectedMealSlot===c.dataset.slot) ? null : c.dataset.slot; renderSheetStep(); };
    });
    if(sheetIsCustomLog){
      body.querySelectorAll('#templatePicks .chip-grid[data-slot="main"] .chip').forEach(c=>{
        c.onclick = ()=>{ selectedMainPick = (selectedMainPick===c.dataset.tpl) ? null : c.dataset.tpl; recomputeFromPicks(); renderSheetStep(); };
      });
      body.querySelectorAll('#templatePicks .chip-grid[data-slot="dessert"] .chip').forEach(c=>{
        c.onclick = ()=>{ selectedDessertPick = (selectedDessertPick===c.dataset.tpl) ? null : c.dataset.tpl; recomputeFromPicks(); renderSheetStep(); };
      });
      body.querySelectorAll('#templatePicks .chip-grid[data-slot="snack"] .chip').forEach(c=>{
        c.onclick = ()=>{ selectedSnackPick = (selectedSnackPick===c.dataset.tpl) ? null : c.dataset.tpl; recomputeFromPicks(); renderSheetStep(); };
      });
      document.getElementById('templateFilter').oninput = e=>{
        const q = e.target.value.trim().toLowerCase();
        document.querySelectorAll('#templatePicks .chip').forEach(c=>{
          const name = (c.dataset.tpl||'').toLowerCase();
          c.style.display = (!q || name.includes(q)) ? '' : 'none';
        });
        document.querySelectorAll('#templatePicks .chip-grid').forEach(grid=>{
          const anyVisible = Array.from(grid.querySelectorAll('.chip')).some(c=>c.style.display!=='none');
          grid.style.display = anyVisible ? '' : 'none';
          const label = grid.previousElementSibling;
          if(label && label.classList.contains('chip-group-label')) label.style.display = anyVisible ? '' : 'none';
        });
      };
    }
    footer.innerHTML = '<button class="btn-next" id="nextBtn" style="flex:1;">Next</button>';
    document.getElementById('nextBtn').onclick = ()=>{ sheetStep=2; renderSheetStep(); };
  }

  else if(sheetStep===2){
    const rootF = FOODS.filter(f=>f.group==='root').map(f=>f.name);
    const leafyF = FOODS.filter(f=>f.group==='leafy').map(f=>f.name);
    const gardenF = FOODS.filter(f=>f.group==='garden').map(f=>f.name);
    body.innerHTML =
      '<div class="sheet-step-title">Which vegetable(s)?</div>'+
      '<div class="chip-group-label">Root veg</div><div class="chip-grid">'+chipListHtml(rootF, selectedItems, 'food')+'</div>'+
      '<div class="chip-group-label">Leafy &amp; green veg</div><div class="chip-grid">'+chipListHtml(leafyF, selectedItems, 'food')+'</div>'+
      '<div class="chip-group-label">Garden veg</div><div class="chip-grid">'+chipListHtml(gardenF, selectedItems, 'food')+'</div>';
    body.querySelectorAll('.chip').forEach(c=>{
      c.onclick = ()=>{
        const f = c.dataset.food;
        if(selectedItems.includes(f)) selectedItems = selectedItems.filter(x=>x!==f);
        else if(selectedItems.length<ITEM_CAP) selectedItems.push(f);
        renderSheetStep();
      };
    });
    footer.innerHTML = '<button class="btn-back" id="backBtn">Back</button><button class="btn-next" id="nextBtn">Next</button>';
    document.getElementById('backBtn').onclick = ()=>{ sheetStep=1; renderSheetStep(); };
    document.getElementById('nextBtn').onclick = ()=>{ sheetStep=3; renderSheetStep(); };
  }

  else if(sheetStep===3){
    const legF = FOODS.filter(f=>f.group==='legume').map(f=>f.name);
    const carbF = FOODS.filter(f=>f.group==='carb').map(f=>f.name);
    const dairyF = FOODS.filter(f=>f.group==='dairy').map(f=>f.name);
    body.innerHTML =
      '<div class="sheet-step-title">Any legume, carb or dairy?</div>'+
      '<input type="text" id="step3Filter" placeholder="Search this list…" style="margin-bottom:12px;">'+
      '<div id="step3Lists">'+
        '<div class="chip-group-label">Legumes</div><div class="chip-grid">'+chipListHtml(legF, selectedItems, 'food')+'</div>'+
        '<div class="chip-group-label">Carbs &amp; grains</div><div class="chip-grid">'+chipListHtml(carbF, selectedItems, 'food')+'</div>'+
        '<div class="chip-group-label">Dairy</div><div class="chip-grid">'+chipListHtml(dairyF, selectedItems, 'food')+'</div>'+
      '</div>'+
      '<p style="font-size:12px;color:var(--text-muted);margin-top:12px;">Optional — skip if this meal is veg only.</p>';
    body.querySelectorAll('.chip').forEach(c=>{
      c.onclick = ()=>{
        const f = c.dataset.food;
        if(selectedItems.includes(f)) selectedItems = selectedItems.filter(x=>x!==f);
        else if(selectedItems.length<ITEM_CAP) selectedItems.push(f);
        renderSheetStep();
      };
    });
    document.getElementById('step3Filter').oninput = e=>{
      const q = e.target.value.trim().toLowerCase();
      document.querySelectorAll('#step3Lists .chip').forEach(c=>{
        const name = (c.dataset.food||'').toLowerCase();
        c.style.display = (!q || name.includes(q)) ? '' : 'none';
      });
      document.querySelectorAll('#step3Lists .chip-grid').forEach(grid=>{
        const anyVisible = Array.from(grid.querySelectorAll('.chip')).some(c=>c.style.display!=='none');
        grid.style.display = anyVisible ? '' : 'none';
        const label = grid.previousElementSibling;
        if(label && label.classList.contains('chip-group-label')) label.style.display = anyVisible ? '' : 'none';
      });
    };
    footer.innerHTML = '<button class="btn-back" id="backBtn">Back</button><button class="btn-next" id="nextBtn">Next</button>';
    document.getElementById('backBtn').onclick = ()=>{ sheetStep=2; renderSheetStep(); };
    document.getElementById('nextBtn').onclick = ()=>{ sheetStep=4; renderSheetStep(); };
  }

  else if(sheetStep===4){
    body.innerHTML =
      '<div class="sheet-step-title">Any spice?</div>'+
      '<div class="chip-group-label">Everyday</div>'+
      '<div class="chip-grid">'+chipListHtml(SPICES, selectedSpices, 'sp')+'</div>'+
      '<div class="chip-group-label" style="margin-top:16px;">Occasional</div>'+
      '<p style="font-size:11.5px;color:var(--text-muted);margin-bottom:8px;">Fine to use — just worth a quick reason why these sit apart from the everyday list. Tap one to see why.</p>'+
      '<div class="chip-grid">'+SPICES_CAUTION.map(sp=>
        '<button type="button" class="chip'+(selectedSpices.includes(sp.name)?' selected':'')+'" data-sp="'+escapeHtml(sp.name)+'" data-note="'+escapeHtml(sp.note)+'">'+badgeSvg(sp.name,24)+'<span>'+escapeHtml(sp.name)+'</span></button>'
      ).join('')+'</div>'+
      '<div id="cautionNote" style="display:none;font-size:12px;color:var(--text-muted);margin-top:8px;padding:10px;background:var(--bg);border-radius:8px;"></div>'+
      '<p style="font-size:12px;color:var(--text-muted);margin-top:12px;">Optional — ground, no salt, a pinch is plenty.</p>';
    body.querySelectorAll('.chip[data-sp]').forEach(c=>{
      c.onclick = ()=>{
        const n = c.dataset.sp;
        if(c.dataset.note){
          const noteEl = document.getElementById('cautionNote');
          noteEl.textContent = n+': '+c.dataset.note;
          noteEl.style.display = 'block';
        }
        if(selectedSpices.includes(n)) selectedSpices = selectedSpices.filter(x=>x!==n);
        else selectedSpices.push(n);
        renderSheetStep();
      };
    });
    footer.innerHTML = '<button class="btn-back" id="backBtn">Back</button><button class="btn-next" id="nextBtn">Next</button>';
    document.getElementById('backBtn').onclick = ()=>{ sheetStep=3; renderSheetStep(); };
    document.getElementById('nextBtn').onclick = ()=>{ sheetStep=5; renderSheetStep(); };
  }

  else if(sheetStep===5){
    body.innerHTML =
      '<div class="sheet-step-title">Any allergen this meal?</div>'+
      '<div class="checkbox-row" style="margin-bottom:12px;"><input type="checkbox" id="allergenCheck"'+(allergenUsedFlag?' checked':'')+'><span>Allergen used</span></div>'+
      '<div class="sub-fields'+(allergenUsedFlag?' open':'')+'" id="allergenFields">'+
        '<div class="chip-grid" id="allergenChips">'+chipListHtml(ALLERGENS.map(a=>a.name), selectedAllergens, 'al')+'</div>'+
      '</div>';
    document.getElementById('allergenCheck').onchange = e=>{
      allergenUsedFlag = e.target.checked;
      document.getElementById('allergenFields').classList.toggle('open', allergenUsedFlag);
    };
    body.querySelectorAll('#allergenChips .chip').forEach(c=>{
      c.onclick = ()=>{
        const n = c.dataset.al;
        if(selectedAllergens.includes(n)) selectedAllergens = selectedAllergens.filter(x=>x!==n);
        else selectedAllergens.push(n);
        renderSheetStep();
      };
    });
    footer.innerHTML = '<button class="btn-back" id="backBtn">Back</button><button class="btn-next" id="nextBtn">Next</button>';
    document.getElementById('backBtn').onclick = ()=>{ sheetStep=4; renderSheetStep(); };
    document.getElementById('nextBtn').onclick = ()=>{ sheetStep=6; renderSheetStep(); };
  }

  else if(isDessertStep(sheetStep)){
    const fruitNames = FRUITS.map(f=>f.name);
    body.innerHTML =
      '<div class="sheet-step-title">Dessert?</div>'+
      '<p style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">A small piece of fruit after the main — optional, and unlocked now he\u2019s doing well on his veg.</p>'+
      '<div class="chip-grid">'+chipListHtml(fruitNames, selectedItems, 'food')+'</div>';
    body.querySelectorAll('.chip').forEach(c=>{
      c.onclick = ()=>{
        const f = c.dataset.food;
        if(selectedItems.includes(f)) selectedItems = selectedItems.filter(x=>x!==f);
        else if(selectedItems.length<ITEM_CAP) selectedItems.push(f);
        renderSheetStep();
      };
    });
    footer.innerHTML = '<button class="btn-back" id="backBtn">Back</button><button class="btn-next" id="nextBtn">Next</button>';
    document.getElementById('backBtn').onclick = ()=>{ sheetStep=5; renderSheetStep(); };
    document.getElementById('nextBtn').onclick = ()=>{ sheetStep=sheetTotalSteps; renderSheetStep(); };
  }

  else if(isReviewStep(sheetStep)){
    const summaryItems = [...selectedItems, ...selectedSpices, ...(allergenUsedFlag?selectedAllergens:[])];
    body.innerHTML =
      (selectedMealSlot ? '<div class="chip-group-label" style="margin-top:0;">'+escapeHtml(selectedMealSlot)+'</div>' : '')+
      '<div class="sheet-step-title">How did it go?</div>'+
      '<div class="reaction-grid" id="reactionGrid">'+REACTION_OPTIONS.map(ro=>
        '<button type="button" class="reaction-card '+ro.cls+(selectedReaction===ro.value?' selected':'')+'" data-reaction="'+ro.value+'"><div class="rc-icon">'+ro.icon+'</div><div class="rc-label">'+ro.label+'</div></button>'
      ).join('')+'</div>'+
      '<label style="margin-top:18px;">Format</label>'+
      '<div class="format-grid" id="formatGrid">'+FORMAT_OPTIONS.map(fo=>
        '<button type="button" class="format-card'+(selectedFormat===fo.value?' selected':'')+'" data-fmt="'+fo.value+'"><div class="fc-icon">'+fo.icon+'</div><div class="fc-title">'+fo.title+'</div><div class="fc-desc">'+fo.desc+'</div></button>'
      ).join('')+'</div>'+
      (allergenUsedFlag ? (
        '<label style="margin-top:18px;">Allergen reaction observed?</label>'+
        '<div class="chip-grid">'+
          '<button type="button" class="chip'+(selectedAllergenReaction==='fine'?' selected':'')+'" data-ar="fine"><span>No reaction</span></button>'+
          '<button type="button" class="chip'+(selectedAllergenReaction==='reaction'?' selected':'')+'" data-ar="reaction"><span>Reaction observed</span></button>'+
        '</div>'
      ) : '')+
      '<label style="margin-top:18px;">Notes</label>'+
      '<textarea id="notesInput" placeholder="Optional">'+escapeHtml(notesValue)+'</textarea>'+
      '<label style="margin-top:18px;">Summary</label>'+
      '<div class="summary-strip">'+(summaryItems.length ? summaryItems.map(n=>badgeSvg(n,26)).join('') : '<span class="empty">Nothing selected yet</span>')+'</div>';

    body.querySelectorAll('#reactionGrid .reaction-card').forEach(c=>{
      c.onclick = ()=>{ selectedReaction = c.dataset.reaction; renderSheetStep(); };
    });
    body.querySelectorAll('#formatGrid .format-card').forEach(c=>{
      c.onclick = ()=>{ selectedFormat = c.dataset.fmt; renderSheetStep(); };
    });
    body.querySelectorAll('[data-ar]').forEach(c=>{
      c.onclick = ()=>{ selectedAllergenReaction = c.dataset.ar; renderSheetStep(); };
    });
    document.getElementById('notesInput').oninput = e=>{ notesValue = e.target.value; };

    footer.innerHTML = '<button class="btn-back" id="backBtn">Back</button><button class="btn-submit" id="submitBtn">'+(editingId?'Update meal':'Save meal')+'</button>';
    document.getElementById('backBtn').onclick = ()=>{ sheetStep = sheetHasDessert ? 6 : 5; renderSheetStep(); };
    document.getElementById('submitBtn').onclick = saveMeal;
  }
}

async function saveMeal(){
  if(!selectedItems.length){ alert('Pick at least one vegetable, legume, grain or dairy item.'); return; }
  if(!selectedReaction){ alert('Pick a reaction.'); return; }
  const payload = {
    ts: selectedTs ? new Date(selectedTs).toISOString() : new Date().toISOString(),
    mealSlot: selectedMealSlot,
    items: selectedItems,
    format: selectedFormat,
    reaction: selectedReaction,
    spices: selectedSpices,
    allergenUsed: allergenUsedFlag,
    allergens: allergenUsedFlag ? selectedAllergens : [],
    allergenReaction: allergenUsedFlag ? selectedAllergenReaction : null,
    notes: (notesValue||'').trim()
  };
  try{
    if(editingId){ await updateDoc(doc(db,'mealLog',editingId), payload); }
    else { await addDoc(mealsCol, payload); }
    closeSheet();
  }catch(err){ console.error(err); alert('Could not save — check your connection.'); }
}

async function removeEntry(id){
  if(!confirm('Delete this logged meal? This cannot be undone.')) return;
  try{ await deleteDoc(doc(db,'mealLog',id)); }catch(err){ console.error(err); alert('Could not delete — check your connection.'); }
}

// ---------------- Firebase wiring ----------------
onAuthStateChanged(auth, user=>{
  if(!user) return;
  onSnapshot(mealsCol, snap=>{
    entries = snap.docs.map(d=>({id:d.id, ...d.data()}));
    statusEl.textContent = 'live';
    statusEl.className = 'sync-status live';
    renderAll();
  }, err=>{
    statusEl.textContent = 'sync error';
    statusEl.className = 'sync-status err';
    console.error(err);
  });
});
signInAnonymously(auth).catch(err=>{
  statusEl.textContent = 'sync error';
  statusEl.className = 'sync-status err';
  console.error(err);
});
renderAll();
</script>
